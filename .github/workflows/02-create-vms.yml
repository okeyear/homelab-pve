# This is a basic workflow to help you get started with Actions

name: "[ 02 ] Create new VirtualMachines"

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      runner:
        description: "Github Action Runner/Agent"
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

      vm_prefix:
        description: "VM Name Prefix"
        required: true
        default: "k8s-"
        type: string

      vm_template:
        description: "VM Clone from Template"
        required: true
        default: ubuntu26.04
        type: choice
        options:
          - ubuntu26.04
          - ubuntu24.04
          - ubuntu22.04
          - debian13
          - debian12
          - almalinux10
          - almalinux9
          - centos7
          - centos9stream
          - centos10stream
          - alinux3
          - openEuler2403
          - archlinux

      ip_list:
        description: "VMs IP List"
        required: true
        default: "11,101,102"
        type: string

      vm_user:
        description: "VM Guest: OS User"
        required: true
        default: vagrant
        type: choice
        options:
          - vagrant
          - root
env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  # VM_TEMPLATE_ID: ${{ github.event.inputs.vm_template_id }} # vm模板的ID
  VM_PREFIX: ${{ github.event.inputs.vm_prefix }}
  VM_USER: ${{ github.event.inputs.vm_user }}
  CIDR: ${{ vars.CIDR }} # vmbr0 vmbr1 的网段

  # MASTER_IP: 10.10.10.11
  # NODE01_IP: 10.10.10.101
  # NODE02_IP: 10.10.10.102

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  setup-vms:
    name: 🚀 Create VMs for ${{ github.event.inputs.vm_prefix }}
    # The type of runner that the job will run on
    runs-on: ${{ github.event.inputs.runner }}
    # runs-on: [self-hosted]
    # runs-on: ubuntu-latest
    permissions:
      id-token: write # 让 GitHub 颁发 OIDC
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # 像普通官方 action 一样用 with 传参
      - uses: ./pipeline-template/actions/prepare-env
        # with:
        #   node-version: '22'      # 想传啥就传啥
        #   python-version: '3.10'  # 固定版本也行, 这个是 pipeline agent运行用的,不是scf业务环境

      - name: Get VM Template ID
        run: |
          cat > versions.txt <<'EOF'
          2003 alinux3
          2007 centos7
          2008 almalinux8
          2009 almalinux9
          20010 almalinux10

          2109 centos9stream
          21010 centos10stream

          2112 debian12
          2113 debian13

          2204 ubuntu22.04
          2403 openEuler2403
          2404 ubuntu24.04
          2604 ubuntu26.04

          20000 archlinux
          EOF
          temp_id=$(grep "\s${{ github.event.inputs.vm_template }}$" versions.txt | awk '{print $1}')
          # An unknown name has to stop the run here. Without this,
          # VM_TEMPLATE_ID is the empty string and the script below runs
          # `qm clone  1011` three times: three failures, zero VMs, and
          # a green run -- the same silent-failure shape the 01a/01b/01c
          # guard steps exist to remove.
          if [ -z "$temp_id" ]; then
            echo "::error::no VM ID is mapped to '${{ github.event.inputs.vm_template }}' in versions.txt"
            echo "::error::known names: $(awk 'NF {printf "%s ", $2}' versions.txt)"
            exit 1
          fi
          echo "VM_TEMPLATE_ID=$temp_id"      >> "$GITHUB_ENV"
          echo "resolved ${{ github.event.inputs.vm_template }} -> VM $temp_id"

      - name: Install tools
        run: sudo apt-get update -yq && sudo apt-get install -yq sshpass

      - name: Check if already ssh key-based
        id: check-ssh
        run: |
          set +e
          test -d ~/.ssh || mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=5  root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} exit
          if [ $? -eq 0 ]; then
            echo "keyless=true" >> $GITHUB_OUTPUT
          else
            echo "keyless=false" >> $GITHUB_OUTPUT
          fi

      # 1️⃣  把 Runner 接入 tailnet
      - name: setup Tailscale Connect (if needed)
        if: steps.check-ssh.outputs.keyless != 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci # 与 ACL 中的 tag 保持一致
          version: latest # https://pkgs.tailscale.com/stable/#static
          use-cache: "true"

      # 2️⃣  正常通过 100.x 或主机名访问远程机
      - name: Remote command via SSH
        run: |
          # pveHost=$(tailscale status --json | jq -r '.Self.HostName' )
          # sudo tailscale up --advertise-tags=tag:gh --accept-routes --hostname=${pveHost}
          # tailscale status
          test -d ~/.ssh || mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} >> ~/.ssh/known_hosts
          # ssh root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "qm list"

          cat > setup_vms.sh <<'EOF'
          # Create the k8s VMs by cloning a sealed template.
          #
          # set -e is the whole point of this rewrite. Run #9 of this
          # workflow was green and proved nothing: a failed `qm clone` or
          # `qm start` did not stop the loop, the step exited 0, and
          # three missing VMs looked like a pass. Every command that may
          # legitimately fail on a first run therefore carries an
          # explicit `|| true`, so the next real failure is not
          # swallowed along with them.
          set -euo pipefail

          # The runner already substituted the workflow variables into
          # this file; nothing below is expanded on the runner again.
          VM_TEMPLATE_ID=${{ env.VM_TEMPLATE_ID }}
          VM_PREFIX=${{ env.VM_PREFIX }}
          VM_USER=${{ env.VM_USER }}
          CIDR=${{ env.CIDR }}
          DISK_SIZE=40G

          # A single-digit IP is the controlplane, the rest are workers.
          # The comment that used to sit here claimed 4C8G / 8C12G and
          # had never matched the code below it.
          cores_for() { if [ "$1" -ge 10000 ]; then echo 4; else echo 2; fi; }
          mem_for()   { if [ "$1" -ge 10000 ]; then echo 8192; else echo 4096; fi; }

          # Every clone's tags are read off the template that is
          # actually being cloned. Run #9 read them off a hardcoded
          # `qm config 2009` -- the alinux9 template -- and shipped
          # three Ubuntu 26.04 VMs tagged `almalinux9;k8s-`, so anything
          # downstream that selects VMs by tag was silently wrong.
          tpl_cfg=$(qm config "$VM_TEMPLATE_ID")
          if [ "$(printf '%s\n' "$tpl_cfg" | awk '/^template:/ {print $2}')" != "1" ]; then
            echo "::error::VM $VM_TEMPLATE_ID is not marked as a template; qm clone would copy a live VM"
            printf '%s\n' "$tpl_cfg" | sed 's/^/::error::   /'
            exit 1
          fi
          tags=$(printf '%s\n' "$tpl_cfg" | awk '/^tags:/ {print $2}' | sed "s@template@${VM_PREFIX}@")
          if [ -z "$tags" ]; then
            echo "::error::VM $VM_TEMPLATE_ID carries no tags; refusing to clone into empty tags"
            printf '%s\n' "$tpl_cfg" | sed 's/^/::error::   /'
            exit 1
          fi
          echo "template $VM_TEMPLATE_ID -> tags '$tags'"

          GUEST_IPS=""
          GUEST_VMS=""
          CREATED=0
          ips=${{ github.event.inputs.ip_list }}
          arr=(${ips//,/ })
          for i in ${arr[*]}
          do
            VM_ID=10${i##*.}
            VM_NAME="${VM_PREFIX}node${VM_ID}"
            VM_IP="${CIDR}.${i}"
            echo "=== creating VM ${VM_ID} (${VM_NAME}) at ${VM_IP} ==="

            # A same-numbered LXC container is not something this
            # workflow ever creates. The `pct destroy` that used to sit
            # here only ever printed "Configuration file
            # nodes/pve/lxc/<id>.conf does not exist", three times a run.
            if pct status ${VM_ID} >/dev/null 2>&1; then
              pct destroy ${VM_ID} --force
            fi

            # Not existing yet is the normal case on a first run, so
            # these two must not abort the loop. Silence them instead of
            # letting the error text scroll by as if it meant something.
            qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
            sleep 2
            qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

            # `qm clone --full` narrates every 1% of a 20 GiB ZFS-to-ZFS
            # transfer: ~100 lines per VM, ~300 per run. That volume is
            # not cosmetic -- run #12's step was so large that GitHub's
            # own log viewer refused to render it ("This step has been
            # truncated due to its large size"), which puts the ending
            # evidence, the part that actually proves the run, out of
            # reach in the browser.
            #
            # Silence it, but never at the price of hiding a failure: the
            # output goes to a file rather than to /dev/null, and a
            # non-zero clone is still fatal with the real PVE stderr
            # replayed into the annotation. No pipe anywhere -- `qm ...
            # 2>&1 | tail` under `set -o pipefail` would reintroduce the
            # SIGPIPE-141 trap that the check() herestring avoids.
            clone_log=$(mktemp)
            if ! qm clone "$VM_TEMPLATE_ID" "$VM_ID" --full >"$clone_log" 2>&1; then
              echo "::error::qm clone ${VM_TEMPLATE_ID} -> ${VM_ID} failed"
              sed 's/^/::error::   /' "$clone_log"
              rm -f "$clone_log"
              exit 1
            fi
            rm -f "$clone_log"
            echo "cloned ${VM_TEMPLATE_ID} -> ${VM_ID} (full)"
            qm set  "$VM_ID" --core "$(cores_for $VM_ID)" --memory "$(mem_for $VM_ID)" --name "$VM_NAME"
            qm set  "$VM_ID" --ipconfig0 "ip=${VM_IP}/24,gw=${CIDR}.1"
            qm set  "$VM_ID" --cipassword vagrant --ciuser "$VM_USER"
            # Every clone inherits the template's host key, so this
            # address is a stale known_hosts entry from the last clone.
            ssh-keygen -f "$HOME/.ssh/known_hosts" -R "$VM_IP" >/dev/null 2>&1 || true
            qm disk resize "$VM_ID" scsi0 "$DISK_SIZE"
            qm set  "$VM_ID" --tags "$tags"
            qm start "$VM_ID"

            # ---------- post-creation verification, per VM ----------
            # `qm set` printing "update VM ..." is not evidence that the
            # value took, and a resize prints nothing at all on success.
            # Read every value back out and fail loudly on a mismatch.
            running=0
            for _ in $(seq 1 30); do
              st=$(qm status "$VM_ID" 2>/dev/null || true)
              if [ "$st" = "status: running" ]; then running=1; break; fi
              sleep 2
            done
            if [ "$running" -ne 1 ]; then
              echo "::error::VM ${VM_ID} never reached 'status: running' (last said: '${st}')"
              qm config "$VM_ID" 2>/dev/null | sed 's/^/::error::   /' || true
              exit 1
            fi

            # Kept in a variable, not printed. The full dump is ~30 lines
            # per VM including one ~700-character URL-encoded sshkeys
            # blob, and the only place it is actually needed is the
            # failure path -- check() below replays it under an
            # ::error:: prefix the moment an assertion does not match.
            cfg=$(qm config "$VM_ID")

            fail=0
            # check <label> <expected> <ERE tested against the config>
            # A herestring, not `printf | grep -q`: grep -q exits the
            # moment it matches, and under `set -o pipefail` the writer
            # then dies of SIGPIPE and the whole pipeline reports 141,
            # which would turn a passing check into a failing one.
            check() {
              if grep -qE "$3" <<<"$cfg"; then
                echo "ok   ${VM_ID} $1 = $2"
              else
                echo "::error::VM ${VM_ID} $1 is not '$2' (wanted /$3/)"
                printf '%s\n' "$cfg" | sed 's/^/::error::   /'
                fail=1
              fi
            }
            check name   "$VM_NAME"            "^name: ${VM_NAME}\$"
            check cores  "$(cores_for $VM_ID)" "^cores: $(cores_for $VM_ID)\$"
            check memory "$(mem_for $VM_ID)"   "^memory: $(mem_for $VM_ID)\$"
            check disk   "$DISK_SIZE"          "^scsi0: .*,size=${DISK_SIZE}( |\$)"
            check ip     "${VM_IP}/24"         "ip=${VM_IP}/24,"
            check gw     "${CIDR}.1"           "gw=${CIDR}\.1\$"
            check ciuser "$VM_USER"            "^ciuser: ${VM_USER}\$"
            check tags   "$tags"               "^tags: ${tags}\$"
            if [ "$fail" -ne 0 ]; then
              echo "::error::VM ${VM_ID} was created but does not match what was asked for"
              exit 1
            fi

            GUEST_IPS="${GUEST_IPS} ${VM_IP}"
            GUEST_VMS="${GUEST_VMS} ${VM_ID}:${VM_IP}"
            CREATED=$((CREATED + 1))
          done

          wanted=$(echo $ips | tr ',' ' ' | wc -w)
          if [ "$CREATED" -ne "$wanted" ]; then
            echo "::error::ip_list '${ips}' asked for ${wanted} VMs but only ${CREATED} were verified"
            exit 1
          fi

          # ---------- guest reachability ----------
          # The checks above prove the VMs were *configured*. They cannot
          # prove the clones booted, that cloud-init ran, or that the
          # template's ssh key reached the guest -- which is exactly
          # where a template goes wrong and exactly what a green run
          # hides.
          #
          # The last VM is probed seconds after `qm start`, so a single
          # attempt is not a test of anything: a guest that needs thirty
          # seconds to boot and another thirty for cloud-init fails it
          # while being perfectly healthy. Run #11 saw 10.10.10.102 fail
          # for exactly that reason. So this polls against a wall-clock
          # budget and drops each guest out as it answers, rather than
          # one shot at all of them.
          #
          # Key auth first (the template carries --sshkey), password via
          # sshpass as the fallback (01a sets PasswordAuthentication yes
          # together with --cipassword). </dev/null on both: this script
          # is run from a file now, but its stdin is still the ssh
          # channel, and a guest ssh that reads it would eat the channel.
          probe() {
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=5 -o BatchMode=yes "${VM_USER}@$1" true </dev/null 2>/dev/null; then
              return 0
            fi
            if command -v sshpass >/dev/null 2>&1; then
              if sshpass -p vagrant ssh -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                    "${VM_USER}@$1" true </dev/null 2>/dev/null; then
                return 0
              fi
            fi
            return 1
          }

          GUEST_ROUNDS=60        # 5s apart, so a 5 minute budget
          guest_ok=0
          pending="${GUEST_IPS}"
          round=0
          while [ -n "${pending// /}" ] && [ "$round" -lt "$GUEST_ROUNDS" ]; do
            round=$((round + 1))
            still=""
            for ip in ${pending}; do
              if probe "$ip"; then
                echo "guest ${VM_USER}@${ip} reachable on attempt ${round}"
                guest_ok=$((guest_ok + 1))
              else
                still="${still} ${ip}"
              fi
            done
            pending="${still}"
            if [ -n "${pending// /}" ]; then
              echo "attempt ${round}: still waiting on${pending}"
              sleep 5
            fi
          done

          if [ -n "${pending// /}" ]; then
            echo "::error::these guests never answered ssh in ${GUEST_ROUNDS} attempts:${pending}"
            echo "::error::the VMs are configured but not usable, which a green run"
            echo "::error::used to hide. Check in this order:"
            echo "::error::  1. does template ${VM_TEMPLATE_ID} still carry --sshkey?"
            echo "::error::  2. was it sealed with ciupgrade 1? A clone of a template whose"
            echo "::error::     ciupgrade was already consumed never re-runs cloud-init, so"
            echo "::error::     no user and no key ever appear."
            echo "::error::  3. did the guest's cloud-init fail outright?"
            for pair in ${GUEST_VMS}; do
              echo "::error::--- VM ${pair%%:*} at ${pair##*:} ---"
              qm config "${pair%%:*}" 2>/dev/null | sed 's/^/::error::   /' || true
              qm cloudinit dump "${pair%%:*}" user 2>/dev/null | tail -20 | sed 's/^/::error::   /' || true
            done
            qm list
            exit 1
          fi

          echo "=== all ${CREATED} VMs created and verified ==="
          qm list
          EOF

          cat setup_vms.sh

          # Put the script in a FILE on PVE and run it from there. Do not
          # pipe it into `bash -s`.
          #
          # `bash -s` reads its program from stdin lazily, one chunk at a
          # time, and every command the script runs inherits that same
          # stdin. So the first `ssh` in the guest-reachability probe
          # below consumes the rest of the script as its own input: bash
          # then hits EOF in the middle of the for loop, finishes with
          # whatever it has already parsed, and exits with the status of
          # the last echo -- which is 0. Run #11 did exactly that. The
          # script stopped right after the first unreachable guest, the
          # failure block that was supposed to report it never ran, and
          # the step came back green. This is the same reason 01a/01b/01c
          # stream their guest scripts into a file on the guest instead of
          # piping them to `bash -s`.
          cat setup_vms.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} \
            'cat > /root/setup_vms.sh && bash /root/setup_vms.sh'

      # - uses: actions/checkout@v4

