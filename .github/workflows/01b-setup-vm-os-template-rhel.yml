name: "[ 01b ] Setup VM template RHEL"

# RHEL 系: almalinux。
#
# centos7 / centos9stream 仍是可选的,但目前没有实现。它们以前挂在
# 01-setup-vm-os-template.yml 里,而那里没有任何 step 会命中 —— 选了只
# 会跑完 Tailscale 和 SSH 就"成功"结束,模板根本没生成。现在在这里明确
# 失败,好过静默假绿。
# 真正实现时:换镜像地址,按目标发行版改 guest 里的 yum 仓库,VM ID 对照
# 02-create-vms.yml 里的 versions.txt。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: self-hosted
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: 'OS Version'
        required: true
        default: 'almalinux9'
        type: choice
        options:
          - almalinux10
          - almalinux9
          - almalinux8
          - centos10stream
          - centos9stream
          - centos7

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice
        options:
          - local-zfs
          - local-lvm
          - local

env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

jobs:
  setup-template-rhel:
    name: 🚀 Setup RHEL template ${{ github.event.inputs.OS }}
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    steps:
      - name: Guard unsupported distro
        if: ${{ !contains(github.event.inputs.OS, 'almalinux') && !contains(github.event.inputs.OS, 'centos') }}
        run: |
          echo "::error::${{ github.event.inputs.OS }} is listed here but not implemented yet -- only almalinux*, centos7 and centos9/10stream work."
          echo "::error::Use 01a (deb 系) or 01c (其他), or implement ${{ github.event.inputs.OS }} in this file first."
          exit 1

      - uses: actions/checkout@v5

      # secrets / vars must be passed IN: an action.yml manifest is parsed in a
      # restricted context where `${{ secrets.X }}` fails the run outright.
      # 加 steps 之前先想一下它属于哪个家族 —— 共享的部分放在
      # .github/actions/ 里,不要在这里复制 Tailscale / rsync / qm 那几段。
      - name: Bootstrap runner
        uses: ./.github/actions/pve-tpl-bootstrap
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup AlmaLinux script
        if: contains(github.event.inputs.OS, 'almalinux')
        run: |
          echo setup AlmaLinux script ...
          version=$(echo ${{ github.event.inputs.OS }} | sed 's@almalinux@@')
          vmid=200${version}
          echo "almalinux_ver=$version"      >> "$GITHUB_ENV"
          echo "VM_ID=$vmid"      >> "$GITHUB_ENV"
          cat > setup_almalinux.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_ubuntu.sh /
          # setup_debian.sh: re-exec as root, trace every command, and end with
          # a marker the PVE side can grep for.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          MIRROR="https://mirrors.cernet.edu.cn/almalinux"

          # --- yum repos ----------------------------------------------------------
          # AlmaLinux 9/10 cloud images ship repo files that carry ONLY a
          # metalink=, with no commented baseurl= fallback line to rewrite.
          # Commenting the metalink out therefore leaves dnf with nothing at
          # all, and the very first transaction dies with "Cannot find a valid
          # baseurl for repo: appstream". Editing the stock files in place
          # cannot work here -- disable them and declare what we need.
          mkdir -p /etc/yum.repos.d
          for repo in /etc/yum.repos.d/almalinux*.repo; do
            [ -f "$repo" ] || continue
            mv "$repo" "$repo.disabled"
          done

          # gpgkey is only legal if the keyring file is really there; naming a
          # missing file is itself a hard dnf error
          GPGKEY=''
          for k in /etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux \
                   /etc/pki/rpm-gpg/RPM-GPG-KEY-almalinux; do
            if [ -f "$k" ]; then GPGKEY="gpgkey=file://$k"; break; fi
          done

          # The directory names are CASE SENSITIVE on the mirror: BaseOS,
          # AppStream, extras and CRB, not baseos/appstream/crb. RELEASE comes
          # from the guest's own os-release; basearch must survive this guest
          # shell, which is why it keeps a backslash.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [baseos]
          name=AlmaLinux ${RELEASE} - BaseOS
          baseurl=${MIRROR}/${RELEASE}/BaseOS/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [appstream]
          name=AlmaLinux ${RELEASE} - AppStream
          baseurl=${MIRROR}/${RELEASE}/AppStream/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [extras]
          name=AlmaLinux ${RELEASE} - Extras
          baseurl=${MIRROR}/${RELEASE}/extras/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [crb]
          name=AlmaLinux ${RELEASE} - CRB
          baseurl=${MIRROR}/${RELEASE}/CRB/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the result: a wrong baseurl only surfaces much later, at dnf
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it. sshd
          # takes the first value it sees and sshd_config Include-s this
          # directory at the very top, so 01- wins.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux ------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init ---------------------------------------------------------
          # 修改 让本地hosts生效
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages -----------------------------------------------------------
          # `iproute`, not `iproute2`: that is the Debian/Ubuntu name and dnf
          # fails the whole transaction with "Unable to find a match: iproute2".
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not
          # take the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ------------------------------------------------------------
          # NOTE: the old script ended with `init 0`, which shut the machine down
          # from under the ssh session and made the PVE-side command chain report
          # a failure. Shutting down is the PVE side's job now.
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF

          cat setup_almalinux.sh

      - name: Setup AlmaLinux ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'almalinux')
        # if: contains(github.event.inputs.OS, 'almalinux9')
        run: |
          echo setup ${{ github.event.inputs.OS }} Template  ...
          # VM_ID=2009
          cat > setup_almalinux_tpl.sh <<EOF
          set -e
          # CERNET carries the GenericCloud qcow2 for both 9 and 10, and the
          # campus mirrors are much faster than repo.almalinux.org from here.
          wget -c https://mirrors.cernet.edu.cn/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # 上游备份,PVE 直连不通时手工换回来:
          # wget -c https://repo.almalinux.org/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # wget -c https://mirrors.cloud.tencent.com/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name almalinux${almalinux_ver}tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2 ${STORAGE}
          # 将新导入的磁盘以 scsi 驱动器的方式装载到新建的虚拟机的 scsi 控制器
          # 适用于local-lvm ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          # 适用于local ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw
          # qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw

          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          # 设置磁盘
          qm disk resize $VM_ID scsi0 20G # 设置硬盘大小

          # el9需要设置CPU为host
          # an if statement, not a bare conditional-and command: under set -e a
          # false test used to abort the whole script on almalinux 8
          if [ "${almalinux_ver}" -ge "9" ]; then qm set $VM_ID --cpu cputype=host ; fi

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          # qm set $VM_ID --ssh-pwauth 1
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep 30:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation time.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_almalinux.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_almalinux.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash -s'
          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_almalinux.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_almalinux.sh && bash /home/vagrant/setup_almalinux.sh'          
          EOF

          cat setup_almalinux_tpl.sh

      - name: Seal AlmaLinux
        if: contains(github.event.inputs.OS, 'almalinux')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_almalinux*.sh
          tpl-script: setup_almalinux_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup CentOS 7 script
        if: contains(github.event.inputs.OS, 'centos7')
        run: |
          echo setup CentOS script ...
          case "${{ github.event.inputs.OS }}" in
            centos7) CENTOS_VERSION=7 ; VM_ID=2007 ;;
            *) echo "::error::unsupported centos release ${{ github.event.inputs.OS }}"; exit 1 ;;
          esac
          echo "CENTOS_VERSION=$CENTOS_VERSION"      >> "$GITHUB_ENV"
          echo "VM_ID=$VM_ID"      >> "$GITHUB_ENV"

          cat > setup_centos7.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_almalinux.sh: re-exec
          # under sudo, trace every command, end with a marker the PVE side can
          # grep for.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          MIRROR="https://mirrors.cernet.edu.cn/centos-vault"

          # CentOS 7 went EOL in June 2024 and every repo now lives in the vault
          # tree under the EXACT point release, e.g. centos-vault/7.9.2009/.
          # Two traps: os-release only says "7", and the centos-release package
          # version is "7-9.2009.1.el7", neither of which is the directory name.
          # The release file is the one place that actually spells it out.
          RELEASE=""
          for f in /etc/centos-release /etc/redhat-release; do
            if [ -f "$f" ]; then RELEASE="$(awk '{print $4}' "$f")"; break; fi
          done
          case "$RELEASE" in
            [0-9]*.[0-9]*) ;;
            *) echo "could not read the CentOS point release from the release file" >&2; exit 1 ;;
          esac

          # --- yum repos ----------------------------------------------------------
          # The stock CentOS-*.repo files still point at mirror.centos.org, which
          # serves nothing any more. Move them aside and declare the repos we
          # need, the way setup_almalinux.sh does -- rewriting mirrorlist in place
          # leaves yum with a repo that has no reachable baseurl at all.
          mkdir -p /etc/yum.repos.d
          for repo in /etc/yum.repos.d/CentOS-*.repo; do
            [ -f "$repo" ] || continue
            mv "$repo" "$repo.disabled"
          done

          GPGKEY=''
          for k in /etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7 \
                   /etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7-7; do
            if [ -f "$k" ]; then GPGKEY="gpgkey=file://$k"; break; fi
          done

          # The vault layout is NOT the AlmaLinux one: there is no BaseOS tree
          # (base and appstream are merged under "os"), and extras has no "/os"
          # suffix. basearch keeps its backslash so it survives this shell and is
          # still expanded later by yum.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [base]
          name=CentOS-${RELEASE} - Base/AppStream
          baseurl=${MIRROR}/${RELEASE}/os/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [updates]
          name=CentOS-${RELEASE} - Updates
          baseurl=${MIRROR}/${RELEASE}/updates/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [extras]
          name=CentOS-${RELEASE} - Extras
          baseurl=${MIRROR}/${RELEASE}/extras/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the rewrite: a wrong baseurl only surfaces much later, at yum
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # RHEL 8 and up Include sshd_config.d at the top of sshd_config, so a
          # drop-in alone is enough there. CentOS 7 does NOT -- a drop-in written
          # into that directory would simply never be read, and the sshd change
          # would vanish without a word. Detect it and patch sshd_config itself.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
            echo "sshd_config reads sshd_config.d -- the drop-in is enough"
          else
            echo "no Include directive (CentOS 7 layout) -- patching sshd_config itself"
            cp -a /etc/ssh/sshd_config /etc/ssh/sshd_config.homelab.bak
            sed -i -e 's/^[[:space:]#]*PermitRootLogin[[:space:]].*/PermitRootLogin yes/' \
                   -e 's/^[[:space:]#]*PasswordAuthentication[[:space:]].*/PasswordAuthentication yes/' \
                   /etc/ssh/sshd_config
          fi

          # --- firewall / SELinux ---------------------------------------------------
          # firewalld would otherwise sit between the template and the rest of the
          # cluster; setup-k8s/scripts/01-base-pkgs.sh disables it on RPM distros
          # too, so keep the two consistent.
          systemctl disable --now firewalld || true
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init -----------------------------------------------------------
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          ssh_pwauth: true
          CLOUD

          # --- packages --------------------------------------------------------------
          # CentOS 7 ships yum 3, not dnf, and the names follow RHEL rather than
          # Debian: iproute, not iproute2.
          yum -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                         jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          yum -y update
          yum clean all
          rm -rf /var/cache/yum

          systemctl enable qemu-guest-agent
          # best effort: a reload failure must not take the whole guest setup down
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ---------------------------------------------------------------
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_centos7.sh

      - name: Setup CentOS 7 ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'centos7')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_centos7_tpl.sh <<EOF
          set -e
          # CentOS 7 reached EOL in June 2024. cloud.centos.org still serves the
          # GenericCloud image, but every matching repo only exists under the
          # vault tree now, which the guest script handles.
          wget -c https://cloud.centos.org/centos/7/images/CentOS-7-x86_64-GenericCloud.qcow2
          # 上游备份:
          # wget -c https://vault.centos.org/7.9.2009/cloud/x86_64/images/CentOS-7-x86_64-GenericCloud.qcow2

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name centos7tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID CentOS-7-x86_64-GenericCloud.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm disk resize $VM_ID scsi0 20G

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation
          # time. Keep this comment free of dollar signs and backticks.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_centos7.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_centos7.sh && bash /home/vagrant/setup_centos7.sh'
          EOF
          cat setup_centos7_tpl.sh

      - name: Seal CentOS 7
        if: contains(github.event.inputs.OS, 'centos7')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_centos7*.sh
          tpl-script: setup_centos7_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup CentOS Stream script
        if: contains(github.event.inputs.OS, 'stream')
        run: |
          echo setup CentOS Stream script ...
          # centos9stream -> 9, centos10stream -> 10. The 210x VM IDs are the
          # ones 02-create-vms.yml already looks up.
          version=$(echo "${{ github.event.inputs.OS }}" | sed 's@^centos@@; s@stream$@@')
          case "$version" in
            9|10) ;;
            *) echo "::error::unsupported CentOS Stream version '${{ github.event.inputs.OS }}'"; exit 1 ;;
          esac
          echo "STREAM_VER=$version"      >> "$GITHUB_ENV"
          echo "VM_ID=210${version}"      >> "$GITHUB_ENV"

          cat > setup_centos_stream.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_almalinux.sh -- Stream
          # 9/10 are EL9/EL10, so the tooling matches, only the repo URLs differ.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          MIRROR="https://mirrors.cernet.edu.cn/centos-stream"

          # --- yum repos ----------------------------------------------------------
          # CERNET DOES carry CentOS Stream -- an earlier note in this file claimed
          # it did not, and it does: 9-stream and 10-stream both resolve under
          # mirrors.cernet.edu.cn/centos-stream with the same BaseOS / AppStream /
          # CRB / $basearch/os/ layout as upstream. aliyun and ustc mirror the very
          # same tree. So this script uses CERNET like every other one here, and
          # measured from China it is ~3x faster than mirror.stream.centos.org.
          #
          # Stream has no `extras` tree at all -- the top level is AppStream,
          # BaseOS, CRB, HighAvailability, NFV, ResilientStorage, RT -- and CRB is
          # where extras-style packages live now. Same "move the stock files
          # aside and declare what we need" shape as AlmaLinux: the stock files
          # point at mirrorlist.centos.org, and commenting the metalink out leaves
          # dnf with no baseurl at all.
          mkdir -p /etc/yum.repos.d
          # Disable every stock repo file whatever its name. A name-specific glob
          # is what broke here: `CentOS-Stream*.repo` matched nothing on the
          # GenericCloud image, so the stock baseos/appstream/crb definitions
          # stayed live and the very first transaction died with
          # "Repository baseos is listed more than once in the configuration".
          find /etc/yum.repos.d -maxdepth 1 -type f -name '*.repo' \
               ! -name '99-homelab.repo' \
               -exec sh -c 'for f do mv -- "$f" "$f.disabled"; done' sh {} +

          # Import every key the image already ships. Matching one fixed name is
          # also what broke: the image calls it RPM-GPG-KEY-CentOS-Stream-* with a
          # capital C and S, the lowercase glob missed it, GPGKEY came out empty,
          # and dnf refused the transaction with "you do not have any GPG public
          # keys installed" even though gpgcheck=1 was asking for exactly that.
          for k in /etc/pki/rpm-gpg/*; do
            [ -f "$k" ] || continue
            rpm --import "$k" || true
          done

          # gpgkey= is only an auto-import convenience; the keys are in the rpmdb
          # now. Still name one if it can be found, case-insensitively, so dnf can
          # re-import it later on its own.
          GPGKEY=''
          for k in $(ls -1 /etc/pki/rpm-gpg/ 2>/dev/null | grep -i 'centos.*stream' || true); do
            GPGKEY="gpgkey=file:///etc/pki/rpm-gpg/$k"; break
          done

          # Directory names are CASE SENSITIVE: BaseOS, AppStream, CRB. basearch
          # keeps its backslash so it survives this shell and is still expanded
          # later by dnf.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [baseos]
          name=CentOS Stream ${RELEASE} - BaseOS
          baseurl=${MIRROR}/${RELEASE}-stream/BaseOS/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [appstream]
          name=CentOS Stream ${RELEASE} - AppStream
          baseurl=${MIRROR}/${RELEASE}-stream/AppStream/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [crb]
          name=CentOS Stream ${RELEASE} - CRB
          baseurl=${MIRROR}/${RELEASE}-stream/CRB/\$basearch/os/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the rewrite: a wrong baseurl only surfaces much later, at dnf
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # EL9 and EL10 Include sshd_config.d at the top of sshd_config, and
          # sshd takes the first value it sees, so a 01- drop-in beats
          # cloud-init's 50- without touching the main file.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux -------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init -----------------------------------------------------------
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages --------------------------------------------------------------
          # `iproute`, not `iproute2`: that is the Debian/Ubuntu name and dnf
          # fails the whole transaction with "Unable to find a match: iproute2".
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not
          # take the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ---------------------------------------------------------------
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_centos_stream.sh

      - name: Setup CentOS Stream ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'stream')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_centos_stream_tpl.sh <<EOF
          set -e
          # CentOS Stream 9/10 are still supported, but nothing mirrors them
          # closer than upstream: CERNET, aliyun, tencent, huawei, ustc and nju
          # all 404 on 9-stream. Both the image and the repos come from official.
          wget -c https://cloud.centos.org/centos/${STREAM_VER}-stream/x86_64/images/CentOS-Stream-GenericCloud-${STREAM_VER}-latest.x86_64.qcow2

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name centos${STREAM_VER}streamtpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID CentOS-Stream-GenericCloud-${STREAM_VER}-latest.x86_64.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm disk resize $VM_ID scsi0 20G

          # RHEL 9 and up want the host CPU model exposed. The default qemu64
          # does not advertise the instruction set a modern node expects.
          qm set $VM_ID --cpu cputype=host

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation
          # time. Keep this comment free of dollar signs and backticks.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_centos_stream.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_centos_stream.sh && bash /home/vagrant/setup_centos_stream.sh'
          EOF
          cat setup_centos_stream_tpl.sh

      - name: Seal CentOS Stream
        if: contains(github.event.inputs.OS, 'stream')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_centos_stream*.sh
          tpl-script: setup_centos_stream_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}
