name: "[ 01c ] Setup VM template 其他"

# 非 deb、非 RHEL 的发行版。
#
# alinux3 以前挂在 01-setup-vm-os-template.yml 里,没有任何 step 会命中,选了
# 等于什么都没做。这里保留选项,但立刻明确报错。
#
# openEuler 是 rpm 系但布局自成一套,所以单独放在这里而不是塞进 01b:仓库树是
# everything / EPOL / update,既不是 AlmaLinux 的 BaseOS-AppStream-extras-CRB,
# 也不是 CentOS Stream 的那一套。
#
# 真正实现 alinux3 时照抄下面的骨架,并把 VM ID 对照 02-create-vms.yml 里的
# versions.txt(2003)。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: 'OS Version'
        required: true
        default: 'openEuler2403'
        type: choice
        options:
          - openEuler2403
          - alinux3

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice
        options:
          - local-zfs
          - local-lvm
          - local

env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

jobs:
  setup-template-other:
    name: 🚀 Setup template ${{ github.event.inputs.OS }}
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    steps:
      - name: Guard unsupported distro
        if: ${{ !contains(github.event.inputs.OS, 'openEuler') }}
        run: |
          echo "::error::${{ github.event.inputs.OS }} is listed here but not implemented yet -- only openEuler2403 works."
          echo "::error::Use 01a (deb 系) or 01b (RHEL 系), or implement ${{ github.event.inputs.OS }} in this file first."
          echo "::error::It used to live in 01-setup-vm-os-template.yml, where no step matched it and the"
          echo "::error::run finished green without building anything."
          exit 1

      - uses: actions/checkout@v5

      # secrets / vars must be passed IN: an action.yml manifest is parsed in a
      # restricted context where `${{ secrets.X }}` fails the run outright.
      # 加 steps 之前先想一下它属于哪个家族 —— 共享的部分放在
      # .github/actions/ 里,不要在这里复制 Tailscale / rsync / qm 那几段。
      - name: Bootstrap runner
        uses: ./.github/actions/pve-tpl-bootstrap
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup openEuler script
        if: contains(github.event.inputs.OS, 'openEuler')
        run: |
          echo setup openEuler script ...
          version=$(echo "${{ github.event.inputs.OS }}" | sed 's@^openEuler@@')
          case "$version" in
            2403) OE_RELEASE='24.03-LTS' ;;
            *) echo "::error::unsupported openEuler release ${{ github.event.inputs.OS }}"; exit 1 ;;
          esac
          echo "OE_VERSION=$version"      >> "$GITHUB_ENV"
          echo "OE_RELEASE=$OE_RELEASE"      >> "$GITHUB_ENV"
          echo "VM_ID=2403"      >> "$GITHUB_ENV"

          cat > setup_openeuler.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_almalinux.sh: re-exec
          # under sudo, trace every command, end with a marker the PVE side can
          # grep for.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          MIRROR="https://mirrors.cernet.edu.cn/openeuler"

          # --- yum repos ----------------------------------------------------------
          # openEuler's tree is its own shape: everything/ carries the bulk,
          # EPOL/main/ the extra packages, update/ the point-release updates.
          # There is no BaseOS/AppStream/extras and no CRB. Stock files point at
          # repo.openeuler.org, so the same "move them aside and declare what we
          # need" shape as AlmaLinux applies.
          mkdir -p /etc/yum.repos.d
          for repo in /etc/yum.repos.d/openEuler*.repo; do
            [ -f "$repo" ] || continue
            mv "$repo" "$repo.disabled"
          done

          GPGKEY=''
          for k in /etc/pki/rpm-gpg/RPM-GPG-KEY-openeuler \
                   /etc/pki/rpm-gpg/RPM-GPG-KEY-openEuler; do
            if [ -f "$k" ]; then GPGKEY="gpgkey=file://$k"; break; fi
          done

          # The release is named by the RELEASE variable, not by the version the
          # workflow input carries: 24.03-LTS is what the mirror directory is
          # called, and VERSION_ID only says "24.03". Falling back to the input
          # keeps this honest if os-release is ever unavailable.
          OE_LTS="${OE_LTS:-${RELEASE}-LTS}"
          echo "using openEuler tree ${MIRROR}/${OE_LTS}"

          # NOTE there is no "/os" suffix here -- openEuler puts repodata at the
          # top of the architecture directory. basearch keeps its backslash so it
          # survives this shell and is still expanded later by dnf.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [everything]
          name=openEuler ${OE_LTS} - everything
          baseurl=${MIRROR}/${OE_LTS}/everything/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [epol]
          name=openEuler ${OE_LTS} - EPOL main
          baseurl=${MIRROR}/${OE_LTS}/EPOL/main/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [update]
          name=openEuler ${OE_LTS} - updates
          baseurl=${MIRROR}/${OE_LTS}/update/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the rewrite: a wrong baseurl only surfaces much later, at dnf
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it. sshd
          # takes the first value it sees and sshd_config Include-s this
          # directory at the very top, so 01- wins.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux -------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init -----------------------------------------------------------
          # 修改 让本地hosts生效
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages --------------------------------------------------------------
          # `iproute`, not `iproute2`: that is the Debian/Ubuntu name and dnf
          # fails the whole transaction with "Unable to find a match: iproute2".
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not
          # take the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ---------------------------------------------------------------
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_openeuler.sh

      - name: Setup openEuler ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'openEuler')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_openeuler_tpl.sh <<EOF
          set -e
          # CERNET mirrors openEuler, including the xz-compressed VM image, so
          # there is no reason to pull 550MB from upstream. The one thing to know
          # before trusting a failure here: if the ssh wait below times out, check
          # whether this image actually ships an ENABLED cloud-init -- without it
          # PVE never gets to create the user or inject the SSH key.
          wget -c https://mirrors.cernet.edu.cn/openeuler/openEuler-${OE_RELEASE}/virtual_machine_img/x86_64/openEuler-${OE_RELEASE}-x86_64.qcow2.xz
          # 上游/163 备份:
          # wget -c https://mirrors.163.com/openeuler/openEuler-${OE_RELEASE}/virtual_machine_img/x86_64/openEuler-${OE_RELEASE}-x86_64.qcow2.xz
          xz -d openEuler-${OE_RELEASE}-x86_64.qcow2.xz

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name openEuler2403tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID openEuler-${OE_RELEASE}-x86_64.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm disk resize $VM_ID scsi0 20G

          # el9 需要设置 CPU 为 host,否则内核看不到宿主机的指令集
          qm set $VM_ID --cpu cputype=host

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation
          # time. Keep this comment free of dollar signs and backticks.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            echo "::error::first thing to check: does this image ship an ENABLED cloud-init?"
            exit 1
          fi

          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_openeuler.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_openeuler.sh && bash /home/vagrant/setup_openeuler.sh'
          EOF
          cat setup_openeuler_tpl.sh

      - name: Seal openEuler
        if: contains(github.event.inputs.OS, 'openEuler')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_openeuler*.sh
          tpl-script: setup_openeuler_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}
