name: "[ 01 ] Setup VM template"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: 'OS Version'
        required: true
        default: 'almalinux9'
        type: choice      
        options:
          - ubuntu26.04
          - ubuntu24.04
          - ubuntu22.04
          - debian13
          - debian12
          - debian11
          - almalinux10
          - almalinux9
          - almalinux8
          - centos7
          - centos9stream
          - alinux3
          - openEuler2403

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice      
        options:
          - local-zfs
          - local-lvm
          - local

env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  setup-template:
    name: 🚀 Setup OS template ${{ github.event.inputs.OS }}
    # The type of runner that the job will run on
    # runs-on: [self-hosted]
    # runs-on: ubuntu-latest
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # - uses: actions/checkout@v4

      # 1️⃣  把 Runner 接入 tailnet
      - name: Tailscale Connect
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci     # 与 ACL 中的 tag 保持一致
          version: latest # https://pkgs.tailscale.com/stable/#static
          use-cache: 'true'

      # 2️⃣  正常通过 100.x 或主机名访问远程机
      - name: Remote command via SSH
        run: |
          # pveHost=$(tailscale status --json | jq -r '.Self.HostName' )
          # sudo tailscale up --advertise-tags=tag:gh --accept-routes --hostname=${pveHost}
          # tailscale status
          test -d ~/.ssh || mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} >> ~/.ssh/known_hosts
          # ssh root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "qm list"
          # The Tailscale action installs its own package immediately before this step and
          # its apt/dpkg can still be running when we get here. Both apt-get update
          # and the install then die on a lock, and with -qq the error is swallowed
          # so the step just ends with a bare exit 1. Wait for the package manager
          # to go idle first, and keep the output so a real failure is readable.
          for i in $(seq 1 30); do
            if ! pgrep -x apt-get >/dev/null 2>&1 &&
               ! pgrep -x dpkg    >/dev/null 2>&1 &&
               ! pgrep -x apt     >/dev/null 2>&1; then
              break
            fi
            echo "apt/dpkg still busy, waiting..."
            sleep 2
          done

          sudo apt-get update
          installed=0
          for i in $(seq 1 5); do
            if sudo apt-get install -y cloud-image-utils rsync; then
              installed=1
              break
            fi
            echo "apt-get install attempt $i failed, retrying"
            sleep $((i * 5))
          done
          [ "$installed" -eq 1 ] || { echo "::error::could not install cloud-image-utils rsync"; exit 1; }

      - name: Setup Debian script
        if: contains(github.event.inputs.OS, 'debian')
        run: |
          echo setup Debian script ...
          case "${{ github.event.inputs.OS }}" in
            debian13) DEBIAN_VERSION=13 ; DEBIAN_NAME='trixie'   ;;
            debian12) DEBIAN_VERSION=12 ; DEBIAN_NAME='bookworm' ;;
            debian11) DEBIAN_VERSION=11 ; DEBIAN_NAME='bullseye' ;;
            *) echo "::error::unsupported debian release ${{ github.event.inputs.OS }}"; exit 1 ;;
          esac
          VM_ID=21${DEBIAN_VERSION}
          echo "DEBIAN_VERSION=$DEBIAN_VERSION"      >> "$GITHUB_ENV"
          echo "DEBIAN_NAME=$DEBIAN_NAME"      >> "$GITHUB_ENV"
          echo "VM_ID=$VM_ID"      >> "$GITHUB_ENV"

          # One guest script for every release. Which apt source format is
          # correct is a property of the running guest, not of the workflow
          # input, so the version split has to happen inside the guest --
          # otherwise the runner and the image can disagree and apt gets a
          # source file the release does not understand.
          # The old per-version pair also wrote to /etc/apt/mirrors/, which no
          # Debian has ever shipped, so the ge_13 path was a silent no-op.
          cat > setup_debian.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_ubuntu.sh: re-exec as
          # root, trace every command, and end with a marker the PVE side can
          # grep for so a green step cannot hide a half-finished guest.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux
          export DEBIAN_FRONTEND=noninteractive

          # shellcheck disable=SC1091
          . /etc/os-release
          CODENAME="${VERSION_CODENAME}"
          MIRROR="https://mirrors.cernet.edu.cn/debian/"
          SECURITY_MIRROR="https://mirrors.cernet.edu.cn/debian-security/"

          # --- apt sources -------------------------------------------------------
          # trixie (13) and newer ship a deb822 file and have no
          # /etc/apt/sources.list at all; bookworm (12) and older use the
          # classic one-line-per-suite format. Write whichever one the running
          # release expects and drop the other, so apt never sees a stale source.
          # NB: the major version has to be extracted in its own step. Writing
          # it as ${VERSION_ID%%.*:-0} makes bash read ":-0" as part of the
          # pattern instead of a default, so it returns "13" unchanged and the
          # integer comparison then misfires.
          ver_id="${VERSION_ID:-0}"
          ver_major="${ver_id%%.*}"
          case "$ver_major" in
            ''|*[!0-9]*) ver_major=0 ;;
          esac

          if [ -f /etc/apt/sources.list.d/debian.sources ] ||
             [ "$ver_major" -ge 13 ]; then
            mkdir -p /etc/apt/sources.list.d
            rm -f /etc/apt/sources.list
            cat > /etc/apt/sources.list.d/debian.sources <<MIRRORS
          Types: deb
          URIs: ${MIRROR}
          Suites: ${CODENAME} ${CODENAME}-updates
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: ${SECURITY_MIRROR}
          Suites: ${CODENAME}-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          MIRRORS
            rm -f /etc/apt/sources.list.d/debian.list \
                  /etc/apt/sources.list.d/debian-security.list \
                  /etc/apt/sources.list.d/security.list
          else
            cat > /etc/apt/sources.list <<MIRRORS
          deb ${MIRROR} ${CODENAME} main contrib non-free non-free-firmware
          deb ${MIRROR} ${CODENAME}-updates main contrib non-free non-free-firmware
          deb ${SECURITY_MIRROR} ${CODENAME}-security main contrib non-free non-free-firmware
          MIRRORS
            rm -f /etc/apt/sources.list.d/debian.sources
          fi

          # --- sshd --------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it. sshd
          # takes the first value it sees and sshd_config Include-s this
          # directory at the very top, so 01- wins over cloud-init's 50-.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- cloud-init --------------------------------------------------------
          # keep the static /etc/hosts and our sources.list when apt runs
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          apt_preserve_sources_list: true
          preserve_hostname: false
          CLOUD

          # --- packages ----------------------------------------------------------
          apt-get update
          apt-get install -y vim wget telnet qemu-guest-agent curl ca-certificates \
                             gnupg jq git iproute2

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          systemctl enable qemu-guest-agent

          echo "=== guest setup finished ==="

          # --- cleanup -----------------------------------------------------------
          set +x   # the glob below would otherwise trace dozens of filenames
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_debian.sh
      - name: Setup Debian ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'debian')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_debian_tpl.sh <<EOF
          set -e
          # cloud.debian.org has no CERNET mirror (there is no debian-cloud tree
          # on the university mirrors), but the host itself already resolves to
          # a Chinese backend. Only apt is repointed, inside the guest.
          wget -c https://cloud.debian.org/images/cloud/${DEBIAN_NAME}/latest/debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2

          # disk
          qemu-img resize debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2 20G
          # qm disk resize $VM_ID scsi0 40G # 设置硬盘大小

          # A previous attempt leaves both a VM and a template behind. Without
          # this the second run of the same release dies on "already exists".
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name debian${DEBIAN_VERSION}tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0 # ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw # 
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          # 修改国内源等,参考修改脚本
          # ssh免密钥, 用vagrant的即可,生产环境不合适
          # sudo curl -o /home/vagrant/.ssh/authorized_keys https://ghfast.top/https://raw.githubusercontent.com/hashicorp/vagrant/master/keys/vagrant.pub
          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0 # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent

          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep 45:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation time.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_ubuntu.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_ubuntu.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'sudo bash -s'
          rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace setup_debian.sh vagrant@${CIDR}.250:/home/vagrant/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash setup_debian.sh'
          EOF
          cat setup_debian_tpl.sh

          # copy scripts to PVE
          for pkg in setup_debian*.sh
          do
            rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace $pkg root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/
          done

          # exec scripts on PVE
          # `set -e` matters: with a plain `;` chain only the LAST command decides
          # the exit status, so a script that dies mid-way still turns the step
          # green as long as qm template succeeds.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "set -e; bash setup_debian_tpl.sh; sleep 5; qm shutdown $VM_ID --forceStop || qm stop $VM_ID --timeout 60 || true; sleep 10; qm set $VM_ID --ciupgrade 1; qm template $VM_ID; echo '=== template ready ==='; qm config $VM_ID"                
          
      - name: Setup Ubuntu script
        # if: github.event.inputs.OS == 'ubuntu2404'
        if: contains(github.event.inputs.OS, 'ubuntu')
        run: |
          echo setup ubuntu script ...
          version=$(echo ${{ github.event.inputs.OS }} | sed 's@ubuntu@@')
          vmid=${version/./}
          echo "ubuntu_ver=$version"      >> "$GITHUB_ENV"
          echo "VM_ID=$vmid"      >> "$GITHUB_ENV"

          cat > setup_ubuntu.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Everything here is plain distro tooling.
          # cloud-init logs us in as vagrant, and this script rewrites system
          # files, so re-exec as root first rather than prefixing every command.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux
          export DEBIAN_FRONTEND=noninteractive

          # shellcheck disable=SC1091
          . /etc/os-release
          CODENAME="${UBUNTU_CODENAME:-${VERSION_CODENAME}}"
          MIRROR="https://mirrors.cernet.edu.cn/ubuntu/"

          # --- apt sources -------------------------------------------------------
          # Ubuntu 24.04 and newer ship a deb822 file and have no
          # /etc/apt/sources.list at all; 22.04 and older use the classic
          # one-line-per-suite format. Write whichever one the release expects
          # and drop the other, so apt never sees a stale source.
          # NB: the major version has to be extracted in its own step. Writing
          # it as ${VERSION_ID%%.*:-0} makes bash read ":-0" as part of the
          # pattern instead of a default, so it returns "24.04" unchanged and
          # the integer comparison then fails.
          ver_id="${VERSION_ID:-0}"
          ver_major="${ver_id%%.*}"
          case "$ver_major" in
            ''|*[!0-9]*) ver_major=0 ;;
          esac

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ] ||
             [ "$ver_major" -ge 24 ]; then
            rm -f /etc/apt/sources.list
            cat > /etc/apt/sources.list.d/ubuntu.sources <<MIRRORS
          Types: deb
          URIs: ${MIRROR}
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports ${CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MIRRORS
            rm -f /etc/apt/sources.list.d/ubuntu.sources.cur
          else
            cat > /etc/apt/sources.list <<MIRRORS
          deb ${MIRROR} ${CODENAME} main restricted universe multiverse
          deb ${MIRROR} ${CODENAME}-updates main restricted universe multiverse
          deb ${MIRROR} ${CODENAME}-backports main restricted universe multiverse
          deb ${MIRROR} ${CODENAME}-security main restricted universe multiverse
          MIRRORS
            rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.cur
          fi

          # --- sshd --------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- cloud-init --------------------------------------------------------
          # keep the static /etc/hosts and our sources.list when apt runs
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          apt_preserve_sources_list: true
          preserve_hostname: false
          CLOUD

          # --- packages ----------------------------------------------------------
          apt-get update
          apt-get install -y vim wget telnet qemu-guest-agent curl ca-certificates \
                             gnupg jq git iproute2

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          systemctl enable qemu-guest-agent

          echo "=== guest setup finished ==="

          # --- cleanup -----------------------------------------------------------
          set +x   # the glob below would otherwise trace dozens of filenames
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          cloud-init clean --logs --seed
          history -c
          EOF

      - name: Setup Ubuntu ${{ github.event.inputs.OS }} Template
        # if: github.event.inputs.OS == 'ubuntu2204'
        if: contains(github.event.inputs.OS, 'ubuntu')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          # ubuntu_ver='22.04' # 20.04
          # VM_ID=${ubuntu_ver/./}
          cat > setup_ubuntu_tpl.sh <<EOF
          # 1. download cloud image
          # wget http://cloud-images.ubuntu.com/releases/focal/release/ubuntu-20.04-server-cloudimg-amd64-disk-kvm.img
          wget -c https://cloud-images.ubuntu.com/releases/${ubuntu_ver}/release/ubuntu-${ubuntu_ver}-server-cloudimg-amd64.img
          
          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop
          sleep 2
          qm destroy ${VM_ID} --purge

          # 磁盘默认2.2G, 设置为20G
          qemu-img info ubuntu-${ubuntu_ver}-server-cloudimg-amd64.img
          qemu-img resize ubuntu-${ubuntu_ver}-server-cloudimg-amd64.img 20G
          qemu-img info ubuntu-${ubuntu_ver}-server-cloudimg-amd64.img

          # 2. create vm
          # 创建 id 为 1000 的虚拟机，内存大小为 2G ， CPU 核心数量 2，名称是 ubuntu22.04-template 并设置网卡桥接到 vmbr0
          qm create $VM_ID --core 2 --memory 4096 --name ubuntu${ubuntu_ver/./}tpl --net0 virtio,bridge=vmbr1

          # 3. 导入下载好的云镜像到 local-lvm 存储; 如果没有额外存储，则默认是local
          qm importdisk $VM_ID ubuntu-${ubuntu_ver}-server-cloudimg-amd64.img  ${STORAGE}

          # 转换云镜像为虚拟磁盘
          # qm importdisk $VM_ID ubuntu-20.04-server-cloudimg-amd64.img raid0 --format=qcow2
          # 104 为虚拟机的ID
          # raid0 为存储的名称，如果没有额外存储，则默认是local
          # --format=qcow2 为转换后的格式

          # 4. 将新导入的磁盘以 scsi 驱动器的方式装载到新建的虚拟机的 scsi 控制器
          # 适用于local-lvm
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          # 适用于local
          # qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"

          # 设置磁盘暂时未生效 qm set $VM_ID --scsi0 file=local-lvm:vm-${VM_ID}-disk-0,size=20480M
          qm disk resize $VM_ID scsi0 20G # 设置硬盘大小

          # 5. 添加 cloud init 驱动器
          # The next step is to configure a CDROM drive which will be used to pass the Cloud-Init data to the VM.
          qm set $VM_ID --ide2  ${STORAGE}:cloudinit

          # 6. 将 cloud init 驱动器设置为可启动并限制 BIOS 仅从磁盘启动
          # To be able to boot directly from the Cloud-Init image, set the bootdisk parameter to scsi0, and restrict BIOS to boot from disk only. This will speed up booting, because VM BIOS skips the testing for a bootable CDROM. 
          # --boot cdn //启动顺序。cdrom  disk network 
          qm set $VM_ID --boot cdn --bootdisk scsi0

          # 7. 添加串口控制台
          # Also configure a serial console and use it as a display. Many Cloud-Init images rely on this, as it is an requirement for OpenStack images.
          qm set $VM_ID --serial0 socket --vga serial0

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=$CIDR.250/24,gw=$CIDR.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0   # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          # qm set $VM_ID --ssh-pwauth 1
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent

          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep 45:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation time.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_ubuntu.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_ubuntu.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'sudo bash -s'
          rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace setup_ubuntu.sh vagrant@${CIDR}.250:/home/vagrant/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash setup_ubuntu.sh'
          EOF
          cat setup_ubuntu_tpl.sh

          # copy scripts to PVE
          for pkg in setup_ubuntu*.sh
          do
            rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace $pkg root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/
          done

          # exec scripts on PVE
          # `set -e` matters: with a plain `;` chain only the LAST command decides
          # the exit status, so a script that dies mid-way still turns the step
          # green as long as qm template succeeds.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "set -e; bash setup_ubuntu_tpl.sh; sleep 5; qm shutdown $VM_ID --forceStop || qm stop $VM_ID --timeout 60 || true; sleep 10; qm set $VM_ID --ciupgrade 1; qm template $VM_ID; echo '=== template ready ==='; qm config $VM_ID"

      - name: Setup AlmaLinux script
        if: contains(github.event.inputs.OS, 'almalinux')
        run: |
          echo setup AlmaLinux script ...
          version=$(echo ${{ github.event.inputs.OS }} | sed 's@almalinux@@')
          vmid=200${version}
          echo "almalinux_ver=$version"      >> "$GITHUB_ENV"
          echo "VM_ID=$vmid"      >> "$GITHUB_ENV"
          cat > setup_almalinux.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_ubuntu.sh /
          # setup_debian.sh: re-exec as root, trace every command, and end with
          # a marker the PVE side can grep for.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          MIRROR="https://mirrors.cernet.edu.cn/almalinux"

          # --- yum repos ----------------------------------------------------------
          # Rewrite the host only and keep the path. The stock files read
          #   #baseurl=https://repo.almalinux.org/almalinux/$releasever/BaseOS/$basearch/os/
          # so replacing the WHOLE line (as this script used to) leaves dnf with
          # a baseurl that has no repository path at all and every transaction
          # fails with "Failed to download metadata".
          for repo in /etc/yum.repos.d/almalinux*.repo; do
            [ -f "$repo" ] || continue
            sed -i -e 's|^mirrorlist=|#mirrorlist=|' \
                   -e 's|^metalink=|#metalink=|' \
                   -e "s,^#*baseurl=https\?://\(repo\|mirror\)\.almalinux\.org/almalinux,baseurl=${MIRROR}," \
                   "$repo"
          done
          # prove the rewrite: a wrong baseurl only surfaces much later, at
          # dnf transaction time, as an opaque metadata error
          grep -HE '^(mirrorlist|metalink|baseurl)' /etc/yum.repos.d/almalinux*.repo || true

          # --- sshd ---------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it. sshd
          # takes the first value it sees and sshd_config Include-s this
          # directory at the very top, so 01- wins.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux ------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init ---------------------------------------------------------
          # 修改 让本地hosts生效
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages -----------------------------------------------------------
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute2 socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not
          # take the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ------------------------------------------------------------
          # NOTE: the old script ended with `init 0`, which shut the machine down
          # from under the ssh session and made the PVE-side command chain report
          # a failure. Shutting down is the PVE side's job now.
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF

          cat setup_almalinux.sh

      - name: Setup AlmaLinux ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'almalinux')
        # if: contains(github.event.inputs.OS, 'almalinux9')
        run: |
          echo setup ${{ github.event.inputs.OS }} Template  ...
          # VM_ID=2009
          cat > setup_almalinux_tpl.sh <<EOF
          set -e
          # CERNET carries the GenericCloud qcow2 for both 9 and 10, and the
          # campus mirrors are much faster than repo.almalinux.org from here.
          wget -c https://mirrors.cernet.edu.cn/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # 上游备份,PVE 直连不通时手工换回来:
          # wget -c https://repo.almalinux.org/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # wget -c https://mirrors.cloud.tencent.com/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name almalinux${almalinux_ver}tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2 ${STORAGE}
          # 将新导入的磁盘以 scsi 驱动器的方式装载到新建的虚拟机的 scsi 控制器
          # 适用于local-lvm ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          # 适用于local ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw
          # qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw

          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          # 设置磁盘
          qm disk resize $VM_ID scsi0 20G # 设置硬盘大小

          # el9需要设置CPU为host
          # an if statement, not a bare conditional-and command: under set -e a
          # false test used to abort the whole script on almalinux 8
          if [ "${almalinux_ver}" -ge "9" ]; then qm set $VM_ID --cpu cputype=host ; fi

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          # qm set $VM_ID --ssh-pwauth 1
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep 30:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation time.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            exit 1
          fi

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_almalinux.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_almalinux.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash -s'
          rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace setup_almalinux.sh vagrant@${CIDR}.250:/home/vagrant/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash setup_almalinux.sh'          
          EOF

          cat setup_almalinux_tpl.sh

          # copy scripts to PVE
          for pkg in setup_almalinux*.sh
          do
            rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace $pkg root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/
          done

          # exec scripts on PVE
          # `set -e` matters: with a plain `;` chain only the LAST command decides
          # the exit status, so a script that dies mid-way still turns the step
          # green as long as qm template succeeds.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "set -e; bash setup_almalinux_tpl.sh; sleep 5; qm shutdown $VM_ID --forceStop || qm stop $VM_ID --timeout 60 || true; sleep 10; qm set $VM_ID --ciupgrade 1; qm template $VM_ID; echo '=== template ready ==='; qm config $VM_ID"

      
