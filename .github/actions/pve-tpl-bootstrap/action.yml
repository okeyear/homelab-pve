name: "Bootstrap runner for PVE template builds"
description: "Join the tailnet, trust the PVE host key, and install the runner-side tools every template workflow needs"

# NOTE: everything the caller needs to pass in arrives as an input, even the
# secrets. An action.yml manifest is parsed in a restricted template context
# that has no `secrets`, so `${{ secrets.X }}` written directly in here fails
# the run with "Unrecognized named-value: 'secrets'" before a single step runs.
inputs:
  ts-oauth-client-id:
    description: 'secrets.TS_OAUTH_CLIENT_ID'
    required: true
  ts-oauth-secret:
    description: 'secrets.TS_OAUTH_SECRET'
    required: true
  pve-host:
    description: 'vars.TAILSCALE_HOST'
    required: true
  pve-net:
    description: 'vars.TAILSCALE_NET'
    required: true

runs:
  using: composite
  steps:
    # 1️⃣  把 Runner 接入 tailnet
    - name: Tailscale Connect
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret:    ${{ inputs.ts-oauth-secret }}
        tags: tag:ci     # 与 ACL 中的 tag 保持一致
        version: latest # https://pkgs.tailscale.com/stable/#static
        use-cache: 'true'

    # 2️⃣  正常通过 100.x 或主机名访问远程机
    - name: Remote command via SSH
      shell: bash
      run: |
        # pveHost=$(tailscale status --json | jq -r '.Self.HostName' )
        # sudo tailscale up --advertise-tags=tag:gh --accept-routes --hostname=${pveHost}
        # tailscale status
        test -d ~/.ssh || mkdir -p ~/.ssh
        ssh-keyscan -H ${{ inputs.pve-host }}.${{ inputs.pve-net }} >> ~/.ssh/known_hosts
        # ssh root@${{ inputs.pve-host }}.${{ inputs.pve-net }} "qm list"
        # The Tailscale action installs its own package immediately before this step and
        # its apt/dpkg can still be running when we get here. Both apt-get update
        # and the install then die on a lock, and with -qq the error is swallowed
        # so the step just ends with a bare exit 1. Wait for the package manager
        # to go idle first, and keep the output so a real failure is readable.
        for i in $(seq 1 30); do
          if ! pgrep -x apt-get >/dev/null 2>&1 &&
             ! pgrep -x dpkg    >/dev/null 2>&1 &&
             ! pgrep -x apt     >/dev/null 2>&1; then
            break
          fi
          echo "apt/dpkg still busy, waiting..."
          sleep 2
        done

        sudo apt-get update
        installed=0
        for i in $(seq 1 5); do
          if sudo apt-get install -y cloud-image-utils rsync; then
            installed=1
            break
          fi
          echo "apt-get install attempt $i failed, retrying"
          sleep $((i * 5))
        done
        [ "$installed" -eq 1 ] || { echo "::error::could not install cloud-image-utils rsync"; exit 1; }