name: "[ 01c ] Setup VM template 其他"

# 非 deb、也不是 AlmaLinux / CentOS 那一套仓库布局的发行版。
#
# alinux3 (Alibaba Cloud Linux 3) 以前挂在 01-setup-vm-os-template.yml 里,没有任何
# step 会命中,选了等于什么都没做。现在按 almalinux 的形状实现了,VM ID 取
# 02-create-vms.yml 里 versions.txt 的 2003。
#
# openEuler 是 rpm 系但布局自成一套,所以单独放在这里而不是塞进 01b:仓库树是
# everything / EPOL / update,既不是 AlmaLinux 的 BaseOS-AppStream-extras-CRB,
# 也不是 CentOS Stream 的那一套。alinux3 同理 —— 它是 os / updates / plus /
# advance / powertools,而不是 BaseOS / AppStream。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: 'OS Version'
        required: true
        default: 'openEuler2403'
        type: choice
        options:
          - openEuler2403
          - alinux3

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice
        options:
          - local-zfs
          - local-lvm
          - local

env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

jobs:
  setup-template-other:
    name: 🚀 Setup template ${{ github.event.inputs.OS }}
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    steps:
      - name: Guard unsupported distro
        if: ${{ !contains(github.event.inputs.OS, 'openEuler') && !contains(github.event.inputs.OS, 'alinux3') }}
        run: |
          echo "::error::${{ github.event.inputs.OS }} is listed here but not implemented yet -- only openEuler2403 and alinux3 work."
          echo "::error::Use 01a (deb 系) or 01b (RHEL 系), or implement ${{ github.event.inputs.OS }} in this file first."
          exit 1

      - uses: actions/checkout@v5

      # secrets / vars must be passed IN: an action.yml manifest is parsed in a
      # restricted context where `${{ secrets.X }}` fails the run outright.
      # 加 steps 之前先想一下它属于哪个家族 —— 共享的部分放在
      # .github/actions/ 里,不要在这里复制 Tailscale / rsync / qm 那几段。
      - name: Bootstrap runner
        uses: ./.github/actions/pve-tpl-bootstrap
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup openEuler script
        if: contains(github.event.inputs.OS, 'openEuler')
        run: |
          echo setup openEuler script ...
          version=$(echo "${{ github.event.inputs.OS }}" | sed 's@^openEuler@@')
          case "$version" in
            2403) OE_RELEASE='24.03-LTS' ;;
            *) echo "::error::unsupported openEuler release ${{ github.event.inputs.OS }}"; exit 1 ;;
          esac
          echo "OE_VERSION=$version"      >> "$GITHUB_ENV"
          echo "OE_RELEASE=$OE_RELEASE"      >> "$GITHUB_ENV"
          echo "VM_ID=2403"      >> "$GITHUB_ENV"

          cat > setup_openeuler.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_almalinux.sh: re-exec
          # under sudo, trace every command, end with a marker the PVE side can
          # grep for.
          if [ "$(id -u)" -ne 0 ]; then
            exec sudo -E bash "$0" "$@"
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          MIRROR="https://mirrors.cernet.edu.cn/openeuler"

          # --- yum repos ----------------------------------------------------------
          # openEuler's tree is its own shape: everything/ carries the bulk,
          # EPOL/main/ the extra packages, update/ the point-release updates.
          # There is no BaseOS/AppStream/extras and no CRB. Stock files point at
          # repo.openeuler.org, so the same "move them aside and declare what we
          # need" shape as AlmaLinux applies.
          mkdir -p /etc/yum.repos.d
          # Disable every stock repo file whatever its name. openEuler ships
          # openEuler.repo AND openEuler-addons.repo, and the `openEuler*` glob is
          # exactly the shape that silently matched nothing on the CentOS Stream
          # image -- leaving duplicate definitions and a dnf abort.
          find /etc/yum.repos.d -maxdepth 1 -type f -name '*.repo' \
               ! -name '99-homelab.repo' \
               -exec sh -c 'for f do mv -- "$f" "$f.disabled"; done' sh {} +

          # Import whatever keys the image ships, then name one case-insensitively
          # so dnf can re-import it on its own later.
          for k in /etc/pki/rpm-gpg/*; do
            [ -f "$k" ] || continue
            rpm --import "$k" || true
          done

          GPGKEY=''
          for k in $(ls -1 /etc/pki/rpm-gpg/ 2>/dev/null | grep -i 'openeuler' || true); do
            GPGKEY="gpgkey=file:///etc/pki/rpm-gpg/$k"; break
          done

          # The release is named by the RELEASE variable, not by the version the
          # workflow input carries: 24.03-LTS is what the mirror directory is
          # called, and VERSION_ID only says "24.03". Falling back to the input
          # keeps this honest if os-release is ever unavailable.
          OE_LTS="${OE_LTS:-${RELEASE}-LTS}"
          echo "using openEuler tree ${MIRROR}/${OE_LTS}"

          # NOTE there is no "/os" suffix here -- openEuler puts repodata at the
          # top of the architecture directory. basearch keeps its backslash so it
          # survives this shell and is still expanded later by dnf.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [everything]
          name=openEuler ${OE_LTS} - everything
          baseurl=${MIRROR}/${OE_LTS}/everything/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [epol]
          name=openEuler ${OE_LTS} - EPOL main
          baseurl=${MIRROR}/${OE_LTS}/EPOL/main/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [update]
          name=openEuler ${OE_LTS} - updates
          baseurl=${MIRROR}/${OE_LTS}/update/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the rewrite: a wrong baseurl only surfaces much later, at dnf
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # A drop-in, not a sed over sshd_config.d/*.conf: when that directory
          # does not exist the glob stays literal and sed aborts on it. sshd
          # takes the first value it sees and sshd_config Include-s this
          # directory at the very top, so 01- wins.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux -------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init -----------------------------------------------------------
          # 修改 让本地hosts生效
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages --------------------------------------------------------------
          # `iproute`, not `iproute2`: that is the Debian/Ubuntu name and dnf
          # fails the whole transaction with "Unable to find a match: iproute2".
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not
          # take the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ---------------------------------------------------------------
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_openeuler.sh

      - name: Setup openEuler ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'openEuler')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_openeuler_tpl.sh <<EOF
          set -e
          # CERNET mirrors openEuler, including the xz-compressed VM image, so
          # there is no reason to pull 550MB from upstream. The one thing to know
          # before trusting a failure here: if the ssh wait below times out, check
          # whether this image actually ships an ENABLED cloud-init -- without it
          # PVE never gets to create the user or inject the SSH key.
          wget -c https://mirrors.cernet.edu.cn/openeuler/openEuler-${OE_RELEASE}/virtual_machine_img/x86_64/openEuler-${OE_RELEASE}-x86_64.qcow2.xz
          # 上游/163 备份:
          # wget -c https://mirrors.163.com/openeuler/openEuler-${OE_RELEASE}/virtual_machine_img/x86_64/openEuler-${OE_RELEASE}-x86_64.qcow2.xz
          xz -d openEuler-${OE_RELEASE}-x86_64.qcow2.xz

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name openEuler2403tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID openEuler-${OE_RELEASE}-x86_64.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm disk resize $VM_ID scsi0 20G

          # el9 需要设置 CPU 为 host,否则内核看不到宿主机的指令集
          qm set $VM_ID --cpu cputype=host

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation
          # time. Keep this comment free of dollar signs and backticks.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            echo "::error::first thing to check: does this image ship an ENABLED cloud-init?"
            exit 1
          fi

          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_openeuler.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_openeuler.sh && bash /home/vagrant/setup_openeuler.sh'
          EOF
          cat setup_openeuler_tpl.sh

      - name: Seal openEuler
        if: contains(github.event.inputs.OS, 'openEuler')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_openeuler*.sh
          tpl-script: setup_openeuler_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}

      - name: Setup alinux3 script
        if: contains(github.event.inputs.OS, 'alinux3')
        run: |
          echo setup alinux3 script ...
          case "${{ github.event.inputs.OS }}" in
            alinux3) VM_ID=2003 ;;
            *) echo "::error::unsupported alinux release ${{ github.event.inputs.OS }}"; exit 1 ;;
          esac
          # There is no "latest" alias: Alibaba names every on-prem image with the
          # date it was cut, so the file has to be pinned. 20260828 is the current
          # Alibaba Cloud Linux 3 LTS (3.2104.20260828), published on the same page
          # as https://mirrors.aliyun.com/alinux/3/image/ -- the 20240819 image this
          # was originally written against is now two years stale.
          ALINUX3_IMAGE=aliyun_3_x64_20G_nocloud_alibase_20260828.qcow2
          echo "VM_ID=$VM_ID"                 >> "$GITHUB_ENV"
          echo "ALINUX3_IMAGE=$ALINUX3_IMAGE" >> "$GITHUB_ENV"

          cat > setup_alinux3.sh <<'EOF'
          #!/bin/bash
          # Runs inside the guest. Same contract as setup_almalinux.sh: re-exec
          # under sudo, trace every command, end with a marker the PVE side can
          # grep for.
          if [ "$(id -u)" -ne 0 ]; then
            # `nocloud` images do not promise a NOPASSWD sudo for the cloud-init
            # default user, and a non-interactive ssh has no way to type one. Feed
            # the same throwaway password the workflow already hands the VM with
            # --cipassword; sudo ignores it when NOPASSWD is in effect anyway.
            exec sudo -S -p '' -E bash "$0" "$@" <<<'vagrant'
          fi
          set -eux

          # shellcheck disable=SC1091
          . /etc/os-release
          RELEASE="${VERSION_ID%%.*}"
          # CERNET carries no alinux tree at all (mirrors.cernet.edu.cn/alinux/ is a
          # 404), so this is the one guest script here that cannot use it. Aliyun is
          # the distro's own mirror and is fast from China.
          MIRROR="https://mirrors.aliyun.com/alinux"

          # --- yum repos ----------------------------------------------------------
          # Alibaba Cloud Linux's tree is its own shape again: os / updates / plus /
          # advance / powertools, all with repodata directly under $basearch and NO
          # "/os" suffix, and no BaseOS/AppStream/CRB anywhere. Stock files point at
          # mirrors.cloud.aliyuncs.com, so disable everything and declare what we
          # need -- commenting a metalink out leaves dnf with no baseurl at all.
          mkdir -p /etc/yum.repos.d
          # Disable every stock repo file whatever its name. A name-specific glob is
          # what broke on CentOS Stream: it matched nothing, the stock definitions
          # stayed live, and dnf aborted with "listed more than once".
          find /etc/yum.repos.d -maxdepth 1 -type f -name '*.repo' \
               ! -name '99-homelab.repo' \
               -exec sh -c 'for f do mv -- "$f" "$f.disabled"; done' sh {} +

          # Import whatever keys the image ships, then name one case-insensitively
          # so dnf can re-import it on its own later.
          for k in /etc/pki/rpm-gpg/*; do
            [ -f "$k" ] || continue
            rpm --import "$k" || true
          done

          GPGKEY=''
          for k in $(ls -1 /etc/pki/rpm-gpg/ 2>/dev/null | grep -iE 'aliyun|alinux' || true); do
            GPGKEY="gpgkey=file:///etc/pki/rpm-gpg/$k"; break
          done

          # NOTE no "/os" here -- repodata sits directly under \$basearch.
          cat > /etc/yum.repos.d/99-homelab.repo <<REPO
          [os]
          name=Alibaba Cloud Linux ${RELEASE} - os
          baseurl=${MIRROR}/${RELEASE}/os/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [updates]
          name=Alibaba Cloud Linux ${RELEASE} - updates
          baseurl=${MIRROR}/${RELEASE}/updates/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [plus]
          name=Alibaba Cloud Linux ${RELEASE} - plus
          baseurl=${MIRROR}/${RELEASE}/plus/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1

          [powertools]
          name=Alibaba Cloud Linux ${RELEASE} - powertools
          baseurl=${MIRROR}/${RELEASE}/powertools/\$basearch/
          ${GPGKEY}
          gpgcheck=1
          enabled=1
          REPO
          # prove the rewrite: a wrong baseurl only surfaces much later, at dnf
          # transaction time, as an opaque metadata error
          grep -HE '^(name|baseurl|gpgkey)' /etc/yum.repos.d/99-homelab.repo

          # --- sshd ---------------------------------------------------------------
          # EL8 and later Include sshd_config.d at the top of sshd_config, and sshd
          # takes the first value it sees, so a 01- drop-in beats cloud-init's 50-
          # without touching the main file.
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/01-homelab.conf <<'SSHD'
          PermitRootLogin yes
          PasswordAuthentication yes
          SSHD
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # --- SELinux -------------------------------------------------------------
          if [ -e /etc/selinux/config ]; then
            sed -i 's|^SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config
            # the config edit only lands on the next boot; relax the live policy
            # too so nothing later in this script fights it
            if [ -e /sys/fs/selinux/enforce ]; then setenforce 0 || true ; fi
          fi

          # --- cloud-init -----------------------------------------------------------
          # 修改 让本地hosts生效
          mkdir -p /etc/cloud/cloud.cfg.d
          cat > /etc/cloud/cloud.cfg.d/99-homelab.cfg <<'CLOUD'
          manage_etc_hosts: false
          preserve_hostname: false
          CLOUD

          # --- packages --------------------------------------------------------------
          # `iproute`, not `iproute2`: that is the Debian/Ubuntu name and dnf fails
          # the whole transaction with "Unable to find a match: iproute2".
          dnf -y install vim wget telnet qemu-guest-agent curl ca-certificates \
                           jq git iproute socat conntrack ebtables ipset

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          dnf -y update
          dnf clean all
          rm -rf /var/cache/dnf

          systemctl enable qemu-guest-agent
          # best effort: the drop-in is trivial, but a reload failure must not take
          # the whole guest setup down with it
          systemctl reload sshd || true

          echo "=== guest setup finished ==="

          # --- cleanup ---------------------------------------------------------------
          set +x
          cloud-init clean --logs --seed
          history -c
          EOF
          cat setup_alinux3.sh

      - name: Setup alinux3 ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'alinux3')
        run: |
          echo setup ${{ github.event.inputs.OS }} Template ...
          cat > setup_alinux3_tpl.sh <<EOF
          set -e
          # "nocloud" here means: do NOT use Alibaba's own metadata datasource, use
          # standard cloud-init NoCloud instead -- which is exactly what PVE's
          # \`qm set --ide2 local-zfs:cloudinit\` provides. Same image on the OSS
          # bucket the mirror page links, so it needs no third party mirror.
          wget -c https://alinux3.oss-cn-hangzhou.aliyuncs.com/${ALINUX3_IMAGE}
          # 老的镜像(20240819),需要回退时换这里:
          # wget -c https://alinux3.oss-cn-hangzhou.aliyuncs.com/aliyun_3_x64_20G_nocloud_alibase_20240819.qcow2

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop >/dev/null 2>&1 || true
          sleep 2
          qm destroy ${VM_ID} --purge >/dev/null 2>&1 || true

          qm create $VM_ID --core 2 --memory 4096 --name alinux3tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID ${ALINUX3_IMAGE} ${STORAGE}
          # 将新导入的磁盘以 scsi 驱动器的方式装载到新建的虚拟机的 scsi 控制器
          # 适用于local-lvm ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          # 适用于local ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw

          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          # 设置磁盘 -- 仓库统一 20G,不是参考脚本里的 40G
          qm disk resize $VM_ID scsi0 20G

          # --- cloud-init user data ------------------------------------------------
          # --cicustom REPLACES the user-data Proxmox generates, so this file has
          # to carry the whole first-boot contract instead of patching it.
          #
          # Why it is needed: this image's cloud.cfg gives the cloud-init default
          # user no groups and no sudoers entry, so the first run got as far as
          # `guest ssh ready after 15s` and then died on
          #   vagrant is not in the sudoers file.
          # --ciuser cannot express group membership, and switching to --ciuser
          # root is worse: cloud-init's own default is disable_root: true, which
          # replaces root's authorized_keys with a "please log in as someone else"
          # stub, so root-by-key stops working.
          #
          # `local` is the default directory storage and the only one guaranteed to
          # carry the snippets content, so that is what the snippet path uses. The
          # file stays on the host afterwards, which is what you want: every clone
          # of this template inherits cicustom and needs to be able to read it.
          mkdir -p /var/lib/vz/snippets
          PUBKEY="\$(cat /root/.ssh/id_rsa.pub)"
          cat > /var/lib/vz/snippets/alinux3-user.yaml <<CI
          #cloud-config
          manage_etc_hosts: true
          # Name the default user EXPLICITLY. Without this cloud-init falls back to
          # the image's own default_user and never creates vagrant at all: PVE
          # accepts --cicustom, then ssh simply never comes up, because the
          # meta-data key landed on some other account. The user: line is also
          # what PVE's generated user-data had, and losing it is the only
          # difference between the run that logged in and this one.
          user: vagrant
          # cloud-init's own default is disable_root: true, which replaces root's
          # authorized_keys with a "log in as someone else" stub.
          disable_root: false
          ssh_pwauth: true
          # An explicit users list rather than top-level groups/sudo keys, so this
          # does not depend on how the image's cloud.cfg merges them. This image's
          # default_user has neither a group nor a sudo rule, which is what made
          # the second run die on "vagrant is not in the sudoers file".
          users:
            - name: vagrant
              gecos: homelab
              groups: [wheel]
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              shell: /bin/bash
              lock_passwd: false
          # Listed here as well as through --sshkey, so this snippet stands on its
          # own instead of depending on the meta-data path staying as it is.
          ssh_authorized_keys:
            - "${PUBKEY}"
          CI
          qm set $VM_ID --cicustom "user=local:snippets/alinux3-user.yaml"

          # el9 需要设置 CPU 为 host。alinux3 是 EL8 兼容的,和 almalinux8 一样不设。

          # 导入ssh公钥到虚拟系统。--sshkey feeds meta-data, and --cicustom above
          # replaces only the user-data, so the key still reaches the default
          # user named in the snippet. That is the same path the first run used
          # successfully -- the run only ever failed at sudo, not at login.
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID

          # 等待 cloud-init 跑完、sshd 能连上,不要用固定的 sleep:
          # 启动快的时候白等,启动慢的时候又连不上。
          # NOTE: this heredoc is unquoted, so the RUNNER expands dollar signs while
          # generating the file -- in comments too. CIDR is a runner-side workflow
          # variable and must stay unescaped so the generated script gets the real
          # subnet. Every shell variable below belongs to the PVE side and must keep
          # its backslash, or the runner splices an empty string in at generation
          # time. Keep this comment free of dollar signs and backticks.
          guest_ip="${CIDR}.250"
          ssh-keygen -f "/root/.ssh/known_hosts" -R "\$guest_ip" >/dev/null 2>&1 || true
          ready=0
          for i in \$(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "vagrant@\$guest_ip" true 2>/dev/null; then
              echo "guest ssh ready after \$((i * 5))s"
              ready=1
              break
            fi
            sleep 5
          done
          if [ "\$ready" -ne 1 ]; then
            echo "::error::guest \${guest_ip} did not become reachable over ssh"
            echo "::error::first thing to check: does this nocloud image ship an ENABLED cloud-init?"
            echo "::error::second: \${VM_ID} runs on --cicustom, which REPLACES the user-data; if"
            echo "::error::that snippet lost its 'user:' line, cloud-init creates a different"
            echo "::error::default account and ssh by key fails even though everything booted."
            exit 1
          fi

          # Do NOT rsync into the guest. Not every cloud image ships rsync, and when
          # one does not, the far side of `rsync -e ssh` dies with "command not
          # found" while the local sender reports a protocol error instead.
          # Stream the script over ssh into a real file: the guest script
          # re-execs itself under sudo through argv, so it needs a path on
          # disk, not stdin.
          cat setup_alinux3.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "vagrant@\$guest_ip" 'cat > /home/vagrant/setup_alinux3.sh && bash /home/vagrant/setup_alinux3.sh'
          EOF
          cat setup_alinux3_tpl.sh

      - name: Seal alinux3
        if: contains(github.event.inputs.OS, 'alinux3')
        uses: ./.github/actions/pve-tpl-seal
        with:
          script-glob: setup_alinux3*.sh
          tpl-script: setup_alinux3_tpl.sh
          pve-host: ${{ vars.TAILSCALE_HOST }}
          pve-net: ${{ vars.TAILSCALE_NET }}
