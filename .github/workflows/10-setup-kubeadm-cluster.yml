# This is a basic workflow to help you get started with Actions

name: "[ 10 ] kubeadm Setup k8s cluster"

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner Agent'
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

      vm_user:
        description: 'VM Guest: OS User'
        required: true
        default: vagrant
        type: choice
        options:
          - vagrant
          - root

      VMs:
        description: 'VM list JSON array'
        required: true
        type: string
        default: '["10.10.10.11", "10.10.10.101", "10.10.10.102"]'

      k8s_version:
        description: 'auto = current stable; a number pins an exact minor'
        required: true
        default: 'auto'
        type: choice
        # This list CANNOT be built from a command. workflow_dispatch input
        # metadata is parsed by GitHub before any runner exists, and the form
        # is rendered straight from the YAML, so `options:` only accepts
        # literal scalars -- no expressions, no fromJSON, no shell. That is a
        # platform limit, not a syntax mistake.
        #
        # `auto` is what makes this maintainable: it resolves at run time and
        # never goes stale. The numbered entries exist only to pin a version on
        # purpose, and they are checked against the live supported list below,
        # so listing one that has gone EOL fails loudly instead of quietly
        # installing something nobody supports.
        options:
          - 'auto'
          - '1.37'
          - '1.36'
          - '1.35'
          - '1.34'

env:
  TAILSCALE_HOST: pve
  TAILSCALE_NET: taile80cb.ts.net
  # VM_TEMPLATE_ID: 2009 # vm模板的ID
  # VM_CIDR: 10.10.10 # vmbr0 vmbr1 的网段
  # MASTER_IP: 10.10.10.11
  # NODE01_IP: 10.10.10.101
  # NODE02_IP: 10.10.10.102
  VMs: ${{ github.event.inputs.VMs }}
  VM_USER: ${{ github.event.inputs.vm_user }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  setup:
    name: 🚀 Deploy k8s ${{ github.event.inputs.k8s_version }} via kubeadm
    # The type of runner that the job will run on
    # runs-on: [self-hosted]
    # runs-on: ubuntu-latest
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -yq && sudo apt-get install -yq sshpass
        #   wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        #   sudo install -m 755 yq_linux_amd64 /usr/bin/yq

      - name: Check if already ssh key-based
        id: check-ssh
        run: |
          set +e
          test -d ~/.ssh || mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=5  root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} exit
          if [ $? -eq 0 ]; then
            echo "keyless=true" >> $GITHUB_OUTPUT
          else
            echo "keyless=false" >> $GITHUB_OUTPUT
          fi      

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # 1️⃣  把 Runner 接入 tailnet
      - name: setup Tailscale Connect (if needed)
        if: steps.check-ssh.outputs.keyless != 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci     # 与 ACL 中的 tag 保持一致
          version: latest # https://pkgs.tailscale.com/stable/#static
          use-cache: 'true'

      # - name: Get containerd version
      #   run: |
      #     # pwd
      #     # ls 
      #     # ls setup-k8s/scripts
      #     source setup-k8s/scripts/functions.sh
      #     containerd_ver=$(get_github_latest_release containerd/containerd)
      #     # echo ${containerd_ver}
      #     containerd_ver=${containerd_ver/v/}
      #     # echo ${containerd_ver}
      #     echo "containerd_ver=${containerd_ver}" >> $GITHUB_ENV

      # - name: Cache containerd
      #   id:   cache-containerd
      #   uses: actions/cache@v4
      #   with:
      #     path: /tmp/containerd
      #     key: containerd-${containerd_ver}

      # - name: Download containerd (if cache miss)
      #   if: steps.cache-containerd.outputs.cache-hit != 'true'
      #   shell: bash -el {0}
      #   run: |
      #     source setup-k8s/scripts/functions.sh
      #     [ -d /tmp/containerd ] || mkdir /tmp/containerd
      #     wget "${GHPROXY}https://github.com/containerd/containerd/releases/download/v${containerd_ver}/containerd-${containerd_ver}-linux-amd64.tar.gz" -O /tmp/containerd/containerd-${containerd_ver}-linux-amd64.tar.gz
      #     curl ${GHPROXY}https://raw.githubusercontent.com/containerd/containerd/main/containerd.service -o /tmp/containerd/containerd.service

      #     runc_ver=$(get_github_latest_release opencontainers/runc)
      #     echo "runc_ver=${runc_ver}" >> $GITHUB_ENV
      #     wget ${GHPROXY}https://github.com/opencontainers/runc/releases/download/${runc_ver}/runc.amd64 -O /tmp/containerd/runc.amd64

      #     cni_ver=$(get_github_latest_release containernetworking/plugins)
      #     echo "cni_ver=${cni_ver}" >> $GITHUB_ENV
      #     wget ${GHPROXY}https://github.com/containernetworking/plugins/releases/download/${cni_ver}/cni-plugins-linux-amd64-${cni_ver}.tgz -O /tmp/containerd/cni-plugins-linux-amd64-${cni_ver}.tgz
          
      #     ls /tmp/containerd

      - name: Get k8s version
        run: |
          set -euo pipefail
          # The menu is static (see the note on k8s_version), but the version
          # it points at does not have to be. Resolve it here.
          #
          # dl.k8s.io is kubernetes' own machine-readable endpoint -- plain
          # text, no HTML, ~0.3s. The releases page it replaces is an HTML
          # scrape, and that scrape returns an EMPTY STRING the moment the page
          # changes shape: the old code below assigned the empty result to
          # K8S_VERSION, echoed it, and exited 0. Downstream then got a version
          # with nothing in it, from a green step. -f + the explicit emptiness
          # check below are what turn that class of failure back into a failure.
          wanted="${{ github.event.inputs.k8s_version }}"
          if [ "$wanted" = "auto" ]; then
            K8S_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt || true)
          else
            # Resolver, NOT a support check: this endpoint answers 200 for
            # minors that went EOL years ago (stable-1.33.txt -> v1.33.13), so
            # a 200 here proves nothing about whether the version is still
            # supported. The scrape below is used only as that oracle.
            K8S_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-${wanted}.txt" || true)
          fi
          K8S_VERSION="${K8S_VERSION#v}"

          if [ -z "$K8S_VERSION" ]; then
            echo "::error::could not resolve a k8s version from '${wanted}'"
            echo "::error::tried: https://dl.k8s.io/release/stable${wanted:+-$wanted}.txt"
            exit 1
          fi

          # Herestring, not `curl | grep -q`: grep -q exits on the first match,
          # curl dies of SIGPIPE, and under `set -o pipefail` the whole
          # pipeline reports 141 -- which reads as "this version is NOT
          # supported" for a version that is. Same trap 02-create-vms.sh
          # avoids in its check().
          #
          # ERE, not -P: the page markup is `value>1.37.1 (released: ...)`, so
          # the delimiter after the version is a space. `[^0-9.]` both matches
          # it and stops 1.37 from matching 1.37.1, and PCRE is not available
          # under every locale this runner has used.
          releases=$(curl -fsSL https://kubernetes.io/releases/)
          if ! grep -qE "value>${K8S_VERSION}[^0-9.]" <<<"$releases"; then
            echo "::error::k8s ${K8S_VERSION} is not a currently supported release"
            echo "::error::supported right now: $(grep -oE 'value>[0-9.]+' <<<"$releases" | sed 's/value>//' | paste -sd' ')"
            exit 1
          fi

          echo "k8s version: $K8S_VERSION"
          echo "K8S_VERSION=$K8S_VERSION" >> $GITHUB_ENV


      - name: Sync scripts
        run: |
          MASTER_NODES=$(echo "$VMs" | jq -r '.[0]')
          WORKER_NODES=$(echo "$VMs" | jq -r '.[1:] | join(" ")')
          tee setup-k8s/config.sh <<EOF
          CLUSTER_NAME=${CLUSTER_NAME:-"devops-k8s"}
          K8S_VERSION=${K8S_VERSION}
          POD_CIDR=10.244.0.0/16
          SERVICE_CIDR=10.96.0.0/12
          NODE_PORT_RANGE=30000-32767
          IMAGE_REPO=registry.aliyuncs.com/google_containers
          MASTER_NODES=($MASTER_NODES)
          LoadBalancer=($MASTER_NODES)
          WORKER_NODES=($WORKER_NODES)
          NODE_USER=${VM_USER}
          SSH_KEY_PATH=~/.ssh/id_rsa
          EOF

          rsync --rsync-path="sudo rsync" -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' -avz --partial --progress --inplace setup-k8s root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/

      - name: setup k8s cluster via kubeadm
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "bash setup-k8s/main.sh"          
