# GitLab CI for homelab-pve.
#
# The deliverable of this repo is the GitHub Actions workflows, and the thing
# they get wrong most often is not a syntax error -- it is something that only
# shows up when a step actually runs. So CI here is the same two checks that
# have to pass locally before a push, not a second opinion about them:
#
#   check_workflows.py  parses every workflow and composite action as YAML,
#                       hands every `run:` block to `bash -n`, and rejects the
#                       `${{ }}` shapes and composite-action context lookups
#                       that GitHub only complains about at dispatch time
#
#   gencheck.py         simulates a dispatch: runs each step's shell for real
#                       with the workflow variables filled in, then parses the
#                       setup_*.sh that fall out. A heredoc body is DATA to
#                       bash -n, so a syntax error inside one is invisible to
#                       the first check and only surfaces on the PVE.
#
# It also catches two classes that are semantically wrong rather than
# syntactically wrong, and which have each cost a real run:
#
#   - a runner-side variable that was left escaped, so the generated script
#     ships it blank (an empty ssh_authorized_keys once cost five runs)
#   - a ${NAME} in an unquoted heredoc that the runner has no value for

stages:
  - checks

variables:
  # Both of these exist because the job runs on a host that cannot reach
  # Docker Hub or pypi.org directly. Point them somewhere else rather than
  # editing the job: the accelerator list at https://status.anye.xyz/ is
  # checked hourly, and the first choice going down should not mean editing
  # this file.
  #
  # NOTE: this only covers the job's own image. gitlab-runner additionally
  # pulls registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper
  # before any docker-executor job can start, and that registry is NOT proxied
  # by the Docker Hub accelerators below. If a job hangs on "Pulling docker
  # image ... gitlab-runner-helper ...", no change here will help -- the host
  # has to be able to reach registry.gitlab.com.
  CI_IMAGE: "docker.1ms.run/library/python:3.12-slim"
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore

.workflows:
  image: $CI_IMAGE
  # Name the runner instead of relying on "any runner will take this". The
  # runner that exists here is a group runner tagged docker + self-hosted, and
  # whether it also accepts untagged work is a property of the runner's own
  # config.toml, not of what this project's settings page says. Pinning the
  # tags makes the job say out loud which machine it expects, and turns
  # "stuck pending" into either a run or a runner problem you can see.
  tags:
    - docker
    - self-hosted
  before_script:
    - pip install --quiet pyyaml

workflow-syntax:
  extends: .workflows
  stage: checks
  script:
    - echo "== YAML + bash -n + expression shapes =="
    - python tools/check_workflows.py

dispatch-simulation:
  extends: .workflows
  stage: checks
  script:
    - echo "== simulating every dispatch case =="
    - python tools/gencheck.py
