name: "[ 01 ] Setup VM template"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: 'OS Version'
        required: true
        default: 'almalinux9'
        type: choice      
        options:
          - ubuntu26.04
          - ubuntu24.04
          - ubuntu22.04
          - debian13
          - debian12
          - debian11
          - almalinux10
          - almalinux9
          - almalinux8
          - centos7
          - centos9stream
          - alinux3
          - openEuler2403

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice      
        options:
          - local-zfs
          - local-lvm
          - local

env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  setup-template:
    name: 🚀 Setup OS template ${{ github.event.inputs.OS }}
    # The type of runner that the job will run on
    # runs-on: [self-hosted]
    # runs-on: ubuntu-latest
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      id-token: write   # 让 GitHub 颁发 OIDC
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # - uses: actions/checkout@v4

      # 1️⃣  把 Runner 接入 tailnet
      - name: Tailscale Connect
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci     # 与 ACL 中的 tag 保持一致
          version: latest # https://pkgs.tailscale.com/stable/#static
          use-cache: 'true'

      # 2️⃣  正常通过 100.x 或主机名访问远程机
      - name: Remote command via SSH
        run: |
          # pveHost=$(tailscale status --json | jq -r '.Self.HostName' )
          # sudo tailscale up --advertise-tags=tag:gh --accept-routes --hostname=${pveHost}
          # tailscale status
          test -d ~/.ssh || mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} >> ~/.ssh/known_hosts
          # ssh root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "qm list"
          sudo apt install -yq cloud-image-utils rsync

      - name: Setup Debian script
        if: contains(github.event.inputs.OS, 'debian')
        run: |
          echo setup Debian script ...
          if [ "${{ github.event.inputs.OS }}" = "debian13" ]; then
            DEBIAN_VERSION=13 ; DEBIAN_NAME='trixie'
            SETUP_DEBIAN_SCRIPT=setup_debian_ge_13.sh
          elif [ "${{ github.event.inputs.OS }}" = "debian12" ]; then
            DEBIAN_VERSION=12 ; DEBIAN_NAME='bookworm'
            SETUP_DEBIAN_SCRIPT=setup_debian_le_12.sh
          elif [ "${{ github.event.inputs.OS }}" = "debian11" ]; then
            DEBIAN_VERSION=11 ; DEBIAN_NAME='Bullseye'   
            SETUP_DEBIAN_SCRIPT=setup_debian_le_12.sh        
          fi
          VM_ID=21${DEBIAN_VERSION}
          echo "DEBIAN_VERSION=$DEBIAN_VERSION"      >> "$GITHUB_ENV"
          echo "DEBIAN_NAME=$DEBIAN_NAME"      >> "$GITHUB_ENV"
          echo "VM_ID=$VM_ID"      >> "$GITHUB_ENV"
          echo "SETUP_DEBIAN_SCRIPT=$SETUP_DEBIAN_SCRIPT"      >> "$GITHUB_ENV"

          cat > setup_debian_le_12.sh <<'EOF'
          sudo sed -i 's|^deb http://ftp.debian.org|deb https://mirrors.ustc.edu.cn|g' /etc/apt/sources.list
          sudo sed -i 's|^deb http://security.debian.org|deb https://mirrors.ustc.edu.cn/debian-security|g' /etc/apt/sources.list
          EOF

          cat > setup_debian_ge_13.sh <<'EOF'
          echo https://mirrors.ustc.edu.cn/debian-security > /etc/apt/mirrors/debian-security.list
          echo http://mirrors.tencent.com/debian > /etc/apt/mirrors/debian.list
          EOF
      - name: Setup Debian ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'debian')
        run: |
          echo setup ${{ github.event.inputs.OS }} ...
          cat > setup_debian_tpl.sh <<EOF
          wget -c https://cloud.debian.org/images/cloud/${DEBIAN_NAME}/latest/debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2

          # disk
          qemu-img resize debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2 20G
          # qm disk resize $VM_ID scsi0 40G # 设置硬盘大小

          qm create $VM_ID --core 2 --memory 4096 --name debian${DEBIAN_VERSION}tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2 ${STORAGE}
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0 # ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw # 
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          # 修改国内源等,参考修改脚本
          # ssh免密钥, 用vagrant的即可,生产环境不合适
          # sudo curl -o /home/vagrant/.ssh/authorized_keys https://ghfast.top/https://raw.githubusercontent.com/hashicorp/vagrant/master/keys/vagrant.pub
          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent

          qm start $VM_ID    
          sleep 45

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_ubuntu.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_ubuntu.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'sudo bash -s'
          rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace ${SETUP_DEBIAN_SCRIPT} vagrant@${CIDR}.250:/home/vagrant/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 "bash ${SETUP_DEBIAN_SCRIPT}"
          EOF
          cat ${SETUP_DEBIAN_SCRIPT}

          # copy scripts to PVE
          for pkg in setup_debian_tpl.sh ${SETUP_DEBIAN_SCRIPT}
          do
            rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace $pkg root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/
          done

          # exec scripts on PVE
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "bash setup_debian_tpl.sh; sleep 5; qm stop $VM_ID; sleep 5;qm set $VM_ID --ciupgrade 1; qm template $VM_ID"                
          
      - name: Resolve Ubuntu version
        id: ubuntu
        if: contains(github.event.inputs.OS, 'ubuntu')
        run: |
          set -euo pipefail
          ver='${{ github.event.inputs.OS }}'
          ver="${ver#ubuntu}"
          case "$ver" in
            22.04) codename=jammy    ;;
            24.04) codename=noble    ;;
            26.04) codename=resolute ;;
            *) echo "::error::unsupported ubuntu $ver"; exit 1 ;;
          esac
          vm_id="${ver/./}"
          echo "ver=${ver}"          >> "$GITHUB_OUTPUT"
          echo "codename=${codename}" >> "$GITHUB_OUTPUT"
          echo "vm_id=${vm_id}"      >> "$GITHUB_OUTPUT"

      - name: Download cloud image
        if: contains(github.event.inputs.OS, 'ubuntu')
        env:
          VER: ${{ steps.ubuntu.outputs.ver }}
        run: |
          set -euo pipefail
          img="ubuntu-${VER}-server-cloudimg-amd64.img"
          url="https://cloud-images.ubuntu.com/releases/${VER}/release/${img}"
          echo "downloading ${url}"
          wget -q -c -O "$img" "$url"
          ls -lh "$img"
          echo "IMG=${img}" >> "$GITHUB_ENV"

      - name: Stage guest customization files
        if: contains(github.event.inputs.OS, 'ubuntu')
        env:
          CODENAME: ${{ steps.ubuntu.outputs.codename }}
        run: |
          set -euo pipefail
          rm -rf guest
          mkdir -p guest

          # CERNET mirror (https://help.mirrors.cernet.edu.cn/). It 302-redirects to
          # a per-campus backend and load-balances across them. Replace sources.list
          # wholesale so the distro default never has to be parsed; the deb822 file
          # is dropped separately because 24.04+ ships that instead.
          cat > guest/sources.list <<EOF
          deb https://mirrors.cernet.edu.cn/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://mirrors.cernet.edu.cn/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://mirrors.cernet.edu.cn/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          deb https://mirrors.cernet.edu.cn/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF

          cat > guest/99-homelab.cfg <<'EOF'
          # keep static /etc/hosts; keep our sources.list when apt runs
          apt_preserve_sources_list: true
          preserve_hostname: false
          manage_etc_hosts: false
          datasource_list: [ ConfigDrive, NoCloud ]
          EOF

          cat > guest/01-permitrootlogin.conf <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          EOF

          # Repos that have no first-class Ubuntu package: containerd/runc from
          # the Docker repo, kubeadm/kubelet/kubectl from the kubernetes repo.
          cat > guest/setup-container-runtime.sh <<'EOF'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://mirrors.cernet.edu.cn/docker-ce/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://mirrors.cernet.edu.cn/docker-ce/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list

          # CERNET does not carry the kubernetes repos, so this one stays on Aliyun.
          k8s_minor=1.34
          curl -fsSL "https://mirrors.aliyun.com/kubernetes-new/core/stable/v${k8s_minor}/deb/Release.key" \
            | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://mirrors.aliyun.com/kubernetes-new/core/stable/v${k8s_minor}/deb/ /" \
            > /etc/apt/sources.list.d/kubernetes.list

          apt-get update -qq
          apt-get install -y -qq containerd.io runc

          containerd config default > /etc/containerd/config.toml
          sed -i 's@registry.k8s.io@registry.cn-hangzhou.aliyuncs.com/google_containers@' /etc/containerd/config.toml

          apt-get install -y -qq kubelet kubeadm kubectl cri-tools kubernetes-cni
          apt-mark hold containerd.io runc kubelet kubeadm kubectl cri-tools kubernetes-cni
          EOF

          # Runs inside the chroot. argv1 is the hostname.
          cat > guest/setup.sh <<'EOF'
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          rm -f /etc/machine-id /etc/hostname
          echo "$1" > /etc/hostname

          apt-get update
          apt-get install -y vim wget telnet qemu-guest-agent curl ca-certificates \
                             gnupg jq git iproute2

          # TEMPORARILY DISABLED: containerd + kubernetes.
          # bash /root/setup-container-runtime.sh

          apt-get clean
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          rm -f /root/setup-container-runtime.sh /root/setup.sh

          cloud-init clean --logs --seed
          : > /etc/machine-id
          EOF

          echo "--- guest/sources.list"
          cat guest/sources.list
          ls -l guest/

      - name: Customize image offline
        if: contains(github.event.inputs.OS, 'ubuntu')
        env:
          VER: ${{ steps.ubuntu.outputs.ver }}
        run: |
          set -euo pipefail
          # The image is customized through a chroot on the runner rather than
          # with virt-customize. virt-customize needs a libguestfs appliance, and
          # inside one on a hosted runner the guest cannot resolve anything:
          # passt never forwards DNS in that sandbox and libguestfs overlays the
          # appliance resolv.conf onto the guest's, so not even apt works.
          # Running on PVE instead is blocked by pve-apt-hook, which refuses
          # any transaction that would replace pve-qemu-kvm.
          # qemu-nbd + chroot is the same operation without that appliance layer,
          # and the runner's own network and resolver are known to work.
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils cloud-guest-utils gdisk parted e2fsprogs

          img="${IMG}"
          dev=/dev/nbd0
          mnt=/mnt/tpl-build

          cleanup() {
            sudo umount -R "$mnt"     2>/dev/null || true
            sudo qemu-nbd --disconnect "$dev" 2>/dev/null || true
            sudo rmdir "$mnt"         2>/dev/null || true
          }
          trap cleanup EXIT

          sudo qemu-img resize "$img" 20G
          sudo modprobe nbd max_part=16
          sudo mkdir -p "$mnt"
          sudo qemu-nbd --connect="$dev" --format=qcow2 "$img"

          # qemu-img resize only grows the virtual disk. The GPT entry and the
          # ext4 filesystem inside it stay at the original ~2.2G, so apt runs
          # out of space ("No space left on device") the moment it downloads.
          # The backup GPT header is still sitting at the old end of the disk,
          # which makes a bare `parted resizepart` fail with "Unable to satisfy
          # all constraints", so move it first with sgdisk, then grow the
          # partition and the filesystem.
          sudo sgdisk -e "$dev" || true
          sudo growpart "$dev" 1 || sudo parted -s "$dev" resizepart 1 100%
          sudo partprobe "$dev" || true
          sleep 2

          part=$(sudo lsblk -lnpo NAME,FSTYPE "$dev" | awk '$2 ~ /ext4|xfs|btrfs/ {print $1; exit}')
          if [ -z "$part" ]; then
            sudo partprobe "$dev" || true
            sleep 3
            part=$(sudo lsblk -lnpo NAME,FSTYPE "$dev" | awk '$2 ~ /ext4|xfs|btrfs/ {print $1; exit}')
          fi
          if [ -z "$part" ]; then
            echo "::error::no root filesystem found on ${dev}"
            sudo lsblk -lno NAME,SIZE,FSTYPE,MOUNTPOINT "$dev" || true
            exit 1
          fi
          echo "root partition: $part"
          sudo resize2fs "$part"
          sudo lsblk -lno NAME,SIZE,FSTYPE "$dev"

          sudo mount "$part" "$mnt"
          sudo mount --bind /dev        "$mnt/dev"
          sudo mount --bind /dev/pts    "$mnt/dev/pts"
          sudo mount -t proc proc       "$mnt/proc"
          sudo mount --bind /sys        "$mnt/sys"

          sudo mkdir -p "$mnt/etc/cloud/cloud.cfg.d" "$mnt/etc/ssh/sshd_config.d" "$mnt/root"
          # Cloud images ship these as symlinks pointing at paths that do not
          # exist while the image is offline, so any shell redirect into them
          # follows the link and fails with ENOENT. Clear them first.
          sudo rm -f "$mnt/etc/resolv.conf" "$mnt/etc/machine-id" "$mnt/etc/hostname"
          printf 'nameserver %s\nnameserver 119.29.29.29\n' "${{ env.DNS }}" \
            | sudo tee "$mnt/etc/resolv.conf" > /dev/null
          sudo rm -f "$mnt/etc/apt/sources.list.d/ubuntu.sources" "$mnt/etc/apt/sources.list.d/ubuntu.sources.cur"
          sudo cp guest/sources.list              "$mnt/etc/apt/sources.list"
          sudo cp guest/99-homelab.cfg            "$mnt/etc/cloud/cloud.cfg.d/99-homelab.cfg"
          sudo cp guest/01-permitrootlogin.conf   "$mnt/etc/ssh/sshd_config.d/01-permitrootlogin.conf"
          sudo cp guest/setup.sh                  "$mnt/root/setup.sh"
          sudo cp guest/setup-container-runtime.sh "$mnt/root/setup-container-runtime.sh"

          sudo chroot "$mnt" /bin/bash /root/setup.sh "ubuntu-${{ steps.ubuntu.outputs.ver }}-tpl"

          echo "=== packages installed in the guest"
          sudo chroot "$mnt" dpkg -l containerd.io kubelet qemu-guest-agent 2>/dev/null | tail -5 || true

          cleanup
          trap - EXIT
          sudo qemu-img info "$img"

      - name: Register template on PVE
        if: contains(github.event.inputs.OS, 'ubuntu')
        env:
          VM_ID: ${{ steps.ubuntu.outputs.vm_id }}
          VER: ${{ steps.ubuntu.outputs.ver }}
        run: |
          set -euo pipefail
          pve="${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}"
          ssh_opts="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          img_name="$(basename "${IMG}")"

          # Only the finished image and the qm calls cross to PVE. Nothing is
          # installed there: pve-apt-hook refuses any apt transaction that would
          # replace pve-qemu-kvm, so PVE keeps its own package set untouched.
          cat > register_template.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euxo pipefail
          : "${VM_ID:?}" "${VER:?}" "${STORAGE:?}" "${CIDR:?}" "${DNS:?}" "${IMG_NAME:?}"

          IMG="/root/${IMG_NAME}"

          qm shutdown "$VM_ID" --forceStop 2>/dev/null || true
          qm destroy  "$VM_ID" --purge       2>/dev/null || true

          qm create "$VM_ID" --core 2 --memory 4096 --name "ubuntu${VER}tpl" --net0 virtio,bridge=vmbr1
          qm importdisk "$VM_ID" "$IMG" "$STORAGE"
          qm set "$VM_ID" --scsihw virtio-scsi-pci --scsi0 "$STORAGE:vm-${VM_ID}-disk-0"
          qm disk resize "$VM_ID" scsi0 20G
          qm set "$VM_ID" --tags "template;ubuntu${VER}"
          qm set "$VM_ID" --ide2 "$STORAGE:cloudinit"
          qm set "$VM_ID" --boot cdn --bootdisk scsi0
          qm set "$VM_ID" --serial0 socket --vga serial0
          qm set "$VM_ID" --agent 1
          qm set "$VM_ID" --ipconfig0 "ip=${CIDR}.250/24,gw=${CIDR}.1"
          qm set "$VM_ID" --cipassword vagrant --ciuser vagrant --ciupgrade 1
          qm set "$VM_ID" --nameserver "$DNS" --searchdomain example.com
          qm set "$VM_ID" --sshkey /root/.ssh/id_rsa.pub
          qm template "$VM_ID"

          qm config "$VM_ID"
          SCRIPT

          rsync -e "ssh ${ssh_opts}" -avz --partial --progress --inplace "${IMG}" register_template.sh "root@${pve}:/root/"

          ssh ${ssh_opts} "root@${pve}" \
            "VM_ID=${VM_ID} VER=${VER} STORAGE=${STORAGE} CIDR=${CIDR} DNS=${DNS} IMG_NAME=${img_name} bash /root/register_template.sh"
      - name: Setup AlmaLinux script
        if: contains(github.event.inputs.OS, 'almalinux')
        run: |
          echo setup AlmaLinux script ...
          version=$(echo ${{ github.event.inputs.OS }} | sed 's@almalinux@@')
          vmid=200${version}
          echo "almalinux_ver=$version"      >> "$GITHUB_ENV"
          echo "VM_ID=$vmid"      >> "$GITHUB_ENV"
          cat > setup_almalinux.sh <<'EOF'
          sudo sed -i '/^PasswordAuthentication/s/no/yes/' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
          echo "PermitRootLogin yes" | sudo tee /etc/ssh/sshd_config.d/01-permitrootlogin.conf
          sudo  systemctl restart sshd

          # sudo  systemctl disable --now firewalld
          sudo  sed -i 's|SELINUX=enforcing|SELINUX=disabled|' /etc/selinux/config

          sudo  sed -e 's|^mirrorlist=|#mirrorlist=|g' \
                -e 's|^#.*baseurl=https://.*.almalinux.org|baseurl=https://mirrors.aliyun.com|g' \
                -i.bak \
                /etc/yum.repos.d/almalinux*.repo

          # https://mirrors.cloud.tencent.com/almalinux/
          # https://mirrors.aliyun.com

          # kvm agent
          sudo yum -y install vim wget telnet qemu-guest-agent socat conntrack ebtables ipset
          # 升级kernel 参考其他部分

          # 修改 让本地hosts生效
          sudo sed -i '/update_etc_hosts/s/^#*/#/' /etc/cloud/cloud.cfg 

          # 开启sshd的密码验证
          # sudo sed -i '/ssh_pwauth/s/false/true/' /etc/cloud/cloud.cfg
          sudo sed -i '/^disable_root/s/true/false/' /etc/cloud/cloud.cfg

          sudo yum update -y
          sudo yum clean all
          history -c
          sudo init 0
          EOF

          # cat setup_almalinux.sh

      - name: Setup AlmaLinux ${{ github.event.inputs.OS }} Template
        if: contains(github.event.inputs.OS, 'almalinux')
        # if: contains(github.event.inputs.OS, 'almalinux9')
        run: |
          echo setup ${{ github.event.inputs.OS }} Template  ...
          # VM_ID=2009
          cat > setup_almalinux_tpl.sh <<EOF
          # wget -c https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          wget -c https://repo.almalinux.org/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # wget -c https://mirrors.aliyun.com/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          # wget -c https://mirrors.cloud.tencent.com/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          # wget -c https://mirrors.cloud.tencent.com/almalinux/${almalinux_ver}/cloud/x86_64/images/AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2
          

          VM_ID=$VM_ID
          qm shutdown ${VM_ID} --forceStop
          sleep 2
          qm destroy ${VM_ID} --purge

          qm create $VM_ID --core 2 --memory 4096 --name almalinux${almalinux_ver}tpl --net0 virtio,bridge=vmbr1
          qm importdisk $VM_ID AlmaLinux-${almalinux_ver}-GenericCloud-latest.x86_64.qcow2 ${STORAGE}
          # 将新导入的磁盘以 scsi 驱动器的方式装载到新建的虚拟机的 scsi 控制器
          # 适用于local-lvm ${STORAGE}:vm-${VM_ID}-disk-0
          qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:vm-${VM_ID}-disk-0
          # 适用于local ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw
          # qm set $VM_ID --scsihw virtio-scsi-pci --scsi0 ${STORAGE}:${VM_ID}/vm-${VM_ID}-disk-0.raw

          qm set $VM_ID --ide2 ${STORAGE}:cloudinit
          qm set $VM_ID --boot cdn --bootdisk scsi0
          qm set $VM_ID --serial0 socket --vga serial0
          qm set $VM_ID --tags "template;${{ github.event.inputs.OS }}"
          # 设置磁盘
          qm disk resize $VM_ID scsi0 20G # 设置硬盘大小

          # el9需要设置CPU为host
          [ "${almalinux_ver}" -ge "9" ] && qm set $VM_ID --cpu cputype=host

          # 导入ssh公钥到虚拟系统
          qm set $VM_ID --sshkey ~/.ssh/id_rsa.pub
          qm set $VM_ID --ipconfig0 ip=${CIDR}.250/24,gw=${CIDR}.1  # 设置ip
          qm set $VM_ID --cipassword vagrant --ciuser vagrant --ciupgrade 0  # 设置用户和密码。注意密码在设置之后，会自动隐藏。
          # qm set $VM_ID --ssh-pwauth 1
          qm set $VM_ID --searchdomain example.com --nameserver ${DNS}
          qm set $VM_ID --agent 1 # 需要配合 qemu-guest-agent
          qm start $VM_ID
          sleep 30

          # 访问
          ssh-keygen -f "/root/.ssh/known_hosts" -R "${CIDR}.250"
          # 将脚本内容作为命令执行
          # qm guest exec $VM_ID -- bash -c "\$(cat setup_almalinux.sh)"
          # alias ssh='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          # cat setup_almalinux.sh | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash -s'
          rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace setup_almalinux.sh vagrant@${CIDR}.250:/home/vagrant/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null vagrant@${CIDR}.250 'bash setup_almalinux.sh'          
          EOF

          cat setup_almalinux_tpl.sh

          # copy scripts to PVE
          for pkg in setup_almalinux*.sh
          do
            rsync -e  'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
              -avz --partial --progress --inplace $pkg root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }}:/root/
          done

          # exec scripts on PVE
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@${{ env.TAILSCALE_HOST }}.${{ env.TAILSCALE_NET }} "bash setup_almalinux_tpl.sh; sleep 5; qm stop $VM_ID; sleep 5;qm set $VM_ID --ciupgrade 1; qm template $VM_ID"

      
