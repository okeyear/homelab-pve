name: "[ 01 ] Setup VM template (已废弃)"

# 本文件已按发行版族拆成三个:
#
#   01a-setup-vm-os-template-deb.yml    deb 系  ubuntu + debian
#   01b-setup-vm-os-template-rhel.yml   RHEL 系 almalinux(+ centos,尚未实现)
#   01c-setup-vm-os-template-other.yml  其他    alinux3 / openEuler2403(尚未实现)
#
# 保留在这里,只是为了让按名字找到旧 workflow 的人能看到迁移说明。
# 它现在会直接失败,不会再偷偷跑一个什么都不做的 run。
# 历史 run 记录仍然可以在 GitHub 上查到。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Github Action Runner/Agent'
        required: true
        default: self-hosted
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

      OS:
        description: '已废弃 —— 请改用上面三个 workflow 之一'
        required: true
        default: 'ubuntu24.04'
        type: choice
        options:
          - ubuntu26.04
          - ubuntu24.04
          - ubuntu22.04
          - debian13
          - debian12
          - debian11
          - almalinux10
          - almalinux9
          - almalinux8
          - centos7
          - centos9stream
          - alinux3
          - openEuler2403

      STORAGE:
        description: 'Storage'
        required: true
        default: 'local-zfs'
        type: choice
        options:
          - local-zfs
          - local-lvm
          - local
env:
  TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
  TAILSCALE_NET: ${{ vars.TAILSCALE_NET }}
  CIDR: ${{ vars.CIDR }}  # vmbr0 vmbr1 的网段
  DNS: 223.5.5.5
  STORAGE:  ${{ github.event.inputs.STORAGE }} # 'local-lvm' 'local' 'local-zfs'

jobs:
  deprecated:
    name: 🚀 已拆分为 deb / RHEL / 其他
    runs-on: ${{ github.event.inputs.runner }}
    steps:
      - name: Use one of the split workflows
        run: |
          echo "::error::[ 01 ] Setup VM template 已按发行版族拆成三个 workflow:"
          echo "::error::  deb 系 (ubuntu/debian) -> 01a-setup-vm-os-template-deb.yml"
          echo "::error::  RHEL 系 (almalinux)     -> 01b-setup-vm-os-template-rhel.yml"
          echo "::error::  其他 (alinux/openEuler) -> 01c-setup-vm-os-template-other.yml"
          echo "::error::请在 Actions 页面重新 dispatch 对应的那一个。"
          exit 1
